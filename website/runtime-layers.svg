<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">Runtime layers and services</title>
<desc id="desc">Applications use Raven library APIs. Library code executes through the interpreter or supported AOT backend. Managed execution provides calls, storage and GC, text and numbers, and task scheduling. Service adapters connect console, files, sockets and native interop to OS resources. Layers show responsibilities, not separate processes.</desc>
