<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 855" role="img" aria-labelledby="title desc">
<title id="title">Runtime components and service boundaries</title><desc id="desc">Applications and managed libraries use execution engines, memory management and scheduling with suspension and resumption. JIT and interpreter are execution engines. AOT-produced native code uses runtime services without requiring either engine. Platform services connect the runtime to the operating system.</desc>
<rect width="900" height="855" rx="12" fill="#f5f7fb"/>
<style>text{font-family:system-ui,sans-serif;fill:#14283e;text-anchor:middle}.title{font-size:23px;font-weight:600}.label{font-size:19px;font-weight:600}.item{font-size:16px}.box{fill:white;stroke:#5279a5;stroke-width:1.5}.band{fill:#e5edf7;stroke:#b3c6dd}.arrow{fill:none;stroke:#365b86;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#365b86"/></marker></defs>
<text x="450" y="36" class="title">Runtime components and service boundaries</text>
<rect class="box" x="30" y="60" width="840" height="76" rx="8"/>
<text x="450.0" y="89" class="label">Applications and managed libraries</text>
<text x="450.0" y="115" class="item">Tasks and Promises · collections · JSON · streams · HTTP · SQL</text>
<path d="M450 138 V164" class="arrow"/>
<rect class="band" x="20" y="170" width="860" height="380" rx="10"/>
<text x="450" y="200" class="label">neoCLR runtime · integrated, modular components</text>
<rect class="box" x="35" y="220" width="270" height="140" rx="8"/>
<text x="170.0" y="249" class="label">Execution engines</text>
<text x="170.0" y="275" class="item">JIT · interpreter</text>
<text x="170.0" y="299" class="item">Calls and control flow</text>
<text x="170.0" y="323" class="item">Native code generation</text>
<rect class="box" x="315" y="220" width="270" height="140" rx="8"/>
<text x="450.0" y="249" class="label">Memory management</text>
<text x="450.0" y="275" class="item">Allocation · roots · GC</text>
<text x="450.0" y="299" class="item">Object/resource lifetimes</text>
<text x="450.0" y="323" class="item">Arena/context foundations</text>
<rect class="box" x="595" y="220" width="270" height="140" rx="8"/>
<text x="730.0" y="249" class="label">Scheduling &amp; suspension</text>
<text x="730.0" y="275" class="item">Ready work and I/O waits</text>
<text x="730.0" y="299" class="item">Suspend · retain · resume</text>
<text x="730.0" y="323" class="item">Runtime-owned scheduling</text>
<rect class="box" x="35" y="378" width="830" height="76" rx="8"/>
<text x="450.0" y="407" class="label">Shared runtime contracts</text>
<text x="450.0" y="433" class="item">Metadata and types · initialization · faults · diagnostics · service bindings</text>
<text x="450" y="484" class="item">Suspended activations publish roots; memory management preserves live state.</text>
<text x="450" y="514" class="item">Managed Task/Promise APIs project operations over these runtime services.</text>
<path d="M450 552 V574" class="arrow"/>
<rect class="box" x="30" y="580" width="840" height="76" rx="8"/>
<text x="450.0" y="609" class="label">Platform services and interop</text>
<text x="450.0" y="635" class="item">Console · files · sockets · clocks · security · explicit native libraries</text>
<path d="M450 658 V684" class="arrow"/>
<rect class="box" x="30" y="690" width="840" height="76" rx="8"/>
<text x="450.0" y="719" class="label">Operating system</text>
<text x="450.0" y="745" class="item">Platform-specific implementations behind runtime contracts</text>
<text x="450" y="805" class="item">AOT-produced code also uses runtime services; it does not require an execution engine.</text>
<text x="450" y="832" class="item">This component model does not imply equal coverage or interchangeable GC implementations.</text>
</svg>
