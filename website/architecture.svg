<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" role="img" aria-labelledby="title desc">
<title id="title">From source to execution</title><desc id="desc">Source is compiled into metadata and instructions, decoded and linked, then verified. Execution uses the interpreter or the bounded ARM64 AOT backend and runtime services.</desc>
<rect width="660" height="720" rx="12" fill="#f5f7fb"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#365b86"/></marker></defs>
<text x="330" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#14283e">From source to execution</text>
<rect x="25" y="60" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Raven source / neoIL source</text>
<text x="330" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">Compiler with native target / assembler</text>
<path d="M330 138 V161" stroke="#365b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="165" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Native metadata + instruction bodies</text>
<text x="330" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">PE with #Neo or standalone NEOX; JSON for tooling</text>
<path d="M330 243 V266" stroke="#365b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="270" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Decode, resolve and prepare</text>
<text x="330" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">Explicit dependencies, identities and bound references</text>
<path d="M330 348 V371" stroke="#365b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="375" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Typed verification</text>
<text x="330" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">Check instructions, stack types and call contracts</text>
<path d="M330 453 V476" stroke="#365b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="480" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="509" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Interpreter / ARM64 AOT proof of concept</text>
<text x="330" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">AOT lowers supported code and links a native executable</text>
<path d="M330 558 V581" stroke="#365b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="585" width="610" height="76" rx="8" fill="#ffffff" stroke="#5279a5"/>
<text x="330" y="614" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#14283e">Runtime services and operating system</text>
<text x="330" y="640" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#304b66">Managed storage, GC, text, queues, I/O and native interop</text>
</svg>
