<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Concurrent CPU relative to synchronous GC</title>
<desc id="desc">Lower is better. Synchronous CPU is one for every sample. Compute only: 1.00 times; Reusable buffer: 6.01 times; Steady allocation: 1.68 times; Allocation bursts: 1.61 times; Retained window: 1.59 times; Mixed phases: 1.55 times.</desc>
<rect width="720" height="300" fill="white"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#172554">
<text x="16" y="24" font-size="17">Concurrent CPU relative to sync — lower is better</text>
<text x="16" y="66">Compute only</text>
<rect x="175" y="52" width="71.1" height="21" rx="3" fill="#2563eb"/>
<text x="254.1" y="67">1.00×</text>
<text x="16" y="99">Reusable buffer</text>
<rect x="175" y="85" width="427.3" height="21" rx="3" fill="#2563eb"/>
<text x="610.3" y="100">6.01×</text>
<text x="16" y="132">Steady allocation</text>
<rect x="175" y="118" width="119.6" height="21" rx="3" fill="#2563eb"/>
<text x="302.6" y="133">1.68×</text>
<text x="16" y="165">Allocation bursts</text>
<rect x="175" y="151" width="114.1" height="21" rx="3" fill="#2563eb"/>
<text x="297.1" y="166">1.61×</text>
<text x="16" y="198">Retained window</text>
<rect x="175" y="184" width="112.8" height="21" rx="3" fill="#2563eb"/>
<text x="295.8" y="199">1.59×</text>
<text x="16" y="231">Mixed phases</text>
<rect x="175" y="217" width="110.1" height="21" rx="3" fill="#2563eb"/>
<text x="293.1" y="232">1.55×</text>
<path d="M 246.1 43 V 252" stroke="#64748b" stroke-dasharray="4 3"/>
<text x="221.1" y="273">sync 1×</text>
</g></svg>
