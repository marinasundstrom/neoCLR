[package]
name = "neoclr"
version = "0.1.0-preview.13"
edition = "2024"
rust-version = "1.85"
description = "An experimental .NET-inspired runtime with its own library and Raven integration"
repository = "https://github.com/marinasundstrom/neoCLR"
license = "MIT"
publish = false

[dependencies]
unicode-segmentation = "=1.12.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libffi = "5.2.0"
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ciborium = "=0.2.2"
socket2 = "=0.6.1"
sys-locale = "=0.3.2"
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Networking_WinSock"] }

[features]
# Private compiler experiment; not part of the installed Raven runtime API.
native-metadata = []
