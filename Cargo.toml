[package]
name = "neoclr"
version = "0.1.0-preview.2"
edition = "2024"
rust-version = "1.85"
description = "A .NET-inspired virtual machine with values by default and explicit memory and references"
repository = "https://github.com/marinasundstrom/neoCLR"
license = "MIT"
publish = false

[dependencies]
libffi = "5.2.0"
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
