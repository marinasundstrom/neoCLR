[package]
name = "neoclr-aot-poc"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# Isolate the experimental compiler dependencies from the runtime distribution.
[workspace]

[dependencies]
neoclr = { path = "../..", features = ["native-metadata"] }
serde_json = "1"
cranelift-codegen = { version = "=0.121.2", default-features = false, features = ["std", "arm64", "x86"] }
cranelift-frontend = "=0.121.2"
cranelift-module = "=0.121.2"
cranelift-object = "=0.121.2"
object = { version = "=0.36.7", default-features = false, features = ["write"] }

[dev-dependencies]
object = { version = "=0.36.7", default-features = false, features = ["read", "std"] }
