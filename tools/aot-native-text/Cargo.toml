[package]
name = "neoclr-aot-native-text"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["staticlib"]

[features]
default = []
time-zone-rules = ["dep:chrono", "dep:chrono-tz"]

[dependencies]
unicode-segmentation = "=1.13.2"
chrono = { version = "=0.4.45", default-features = false, optional = true }
chrono-tz = { version = "=0.10.4", default-features = false, optional = true }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
