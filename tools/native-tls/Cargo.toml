[package]
name = "neoclr-native-tls"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
neoclr-security-provider = { path = "../security-provider" }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "=2.2.0"

[profile.release]
panic = "abort"
