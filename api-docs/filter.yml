apiRules:
- include:
    uidRegex: '^System\.Introspection($|\.(TypeInfo|MemberInfo)($|\.))'
- include:
    uidRegex: '^System\.Equatable`1($|\.)'
- exclude:
    uidRegex: '^System\.Runtime\.CompilerServices\.ITaskAwaiter\.OnCompleted($|\()'
    type: Method
- include:
    uidRegex: '^System\.Runtime\.CompilerServices\.(IAsyncStateMachine|ITaskAwaiter|AsyncTaskMethodBuilder`1)($|\.)'
- include:
    uidRegex: '^System\.Runtime\.CompilerServices($|\.IsExternalInit$)'
- include:
    uidRegex: '^System\.HashCode($|\.)'
# Object members are selected explicitly; protected construction is documented manually.
- include:
    uidRegex: '^System\.Object($|\.(GetType|ToString|ReferenceEquals|Equals|GetHashCode)($|\())'
- include:
    uidRegex: '^System\.Value$'
- exclude:
    uidRegex: '^System\.Storage\.FileText\.WriteAllText($|\()'
    type: Method
- exclude:
    uidRegex: '^System\.IO\.(FileOutputStream|OutputStream|TextWriter|StreamWriter)\.Flush($|\()'
    type: Method
- exclude:
    uidRegex: '^System\.Concurrency\.ThreadPool\.#ctor'
- exclude:
    uidRegex: '^System\.Tasks\.(TaskQueue\.(Post|Run)|Task`1\.OnCompleted)(\(|$)'
    type: Method
- include:
    uidRegex: '^System\.Tasks$'
    type: Namespace
- include:
    uidRegex: '^System\.Tasks\.(Task`1|Promise`1|TaskQueue|TaskState)($|\.)'
- include:
    uidRegex: '^System\.Concurrency$'
    type: Namespace
- include:
    uidRegex: '^System\.Concurrency\.(Thread|ThreadPool)($|\.)'
- include:
    uidRegex: '^System\.IO$'
    type: Namespace
- include:
    uidRegex: '^System\.IO\.(InputStream|OutputStream|FileInputStream|FileOutputStream|StreamError|TextReader|StreamReader|TextReadError|SeekableStream|TextWriter|StreamWriter)($|\.)'
- include:
    uidRegex: '^System\.Storage$'
    type: Namespace
- include:
    uidRegex: '^System\.Storage\.(StorageItem|File|Directory|FileText|FileSystem|FileReadError|FileWriteError|StorageProvider|Metadata|EntryKind|StorageLookupError|Path|InvalidPathError)($|\.)'
- include:
    uidRegex: '^System$'
    type: Namespace
- include:
    uidRegex: '^System\.Console($|\.)'
- include:
    uidRegex: '^System\.ConsoleReadError($|\.)'
- exclude:
    uidRegex: '.*'
