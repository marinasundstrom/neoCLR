apiRules:
- exclude:
    uidRegex: '^System\.Storage\.File\.WriteAllText($|\()'
    type: Method
- exclude:
    uidRegex: '^System\.Streams\.(FileOutputStream|OutputStream)\.Flush($|\()'
    type: Method
- exclude:
    uidRegex: '^System\.Concurrency\.ThreadPool\.#ctor'
- exclude:
    uidRegex: '^System\.Tasks\.(TaskQueue\.(Post|Run)|Task`1\.OnCompleted)(\(|$)'
    type: Method
- include:
    uidRegex: '^System\.Tasks$'
    type: Namespace
- include:
    uidRegex: '^System\.Tasks\.(Task`1|Promise`1|TaskQueue|TaskState)($|\.)'
- include:
    uidRegex: '^System\.Concurrency$'
    type: Namespace
- include:
    uidRegex: '^System\.Concurrency\.(Thread|ThreadPool)($|\.)'
- include:
    uidRegex: '^System\.Streams$'
    type: Namespace
- include:
    uidRegex: '^System\.Streams\.(InputStream|OutputStream|FileInputStream|FileOutputStream|StreamError)($|\.)'
- include:
    uidRegex: '^System\.Storage$'
    type: Namespace
- include:
    uidRegex: '^System\.Storage\.(File|Directory|StorageLookup|FileReadError|FileWriteError|StorageProvider|Metadata|EntryKind|StorageLookupError|Path|InvalidPathError)($|\.)'
- exclude:
    uidRegex: '.*'
