apiRules:
- exclude:
    uidRegex: '^System\.Streams\.FileOutputStream\.Flush($|\()'
    type: Method
- exclude:
    uidRegex: '^System\.Concurrency\.ThreadPool\.#ctor'
- exclude:
    uidRegex: '^System\.Tasks\.(TaskQueue\.(Post|Run)|Task`1\.OnCompleted)(\(|$)'
    type: Method
- include:
    uidRegex: '^System\.Tasks$'
    type: Namespace
- include:
    uidRegex: '^System\.Tasks\.(Task`1|Promise`1|TaskQueue|TaskState)($|\.)'
- include:
    uidRegex: '^System\.Concurrency$'
    type: Namespace
- include:
    uidRegex: '^System\.Concurrency\.(Thread|ThreadPool)($|\.)'
- include:
    uidRegex: '^System\.Streams$'
    type: Namespace
- include:
    uidRegex: '^System\.Streams\.(FileInputStream|FileOutputStream|StreamError)($|\.)'
- exclude:
    uidRegex: '.*'
