  name: BindingFlags
  nameWithType: BindingFlags
  fullName: System.Introspection.BindingFlags
  type: Enum
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Selects visibility and instance/static categories for metadata queries.
  remarks: Combine flags with bitwise OR. Current queries enumerate declarations on the requested type only; inherited traversal is not implemented. Unsupported bits fault. This does not grant permission to invoke or access members.
  example: []
  syntax:
    content: >-
      [Flags]

      public enum BindingFlags
    content.vb: >-
      <Flags>

      Public Enum BindingFlags
  attributes:
  - type: System.FlagsAttribute
    ctor: System.FlagsAttribute.#ctor
    arguments: []
