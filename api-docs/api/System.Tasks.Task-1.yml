  fullName: System.Tasks.Task<T>
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Tasks
  summary: A consumer handle for one eventual value or cancellation.
  remarks: Obtain a task from Promise&lt;T&gt;.Task or an async method. Consumers cannot complete it. Expected failures belong in the result type; there is no faulted Task state. This provisional API is confined to one guest invocation. Callback methods using Func&lt;System.Void&gt; are described in the [callback guide](/docs/callbacks.html).
  example: []
  syntax:
    content: 'public sealed class Task<T> : ITaskAwaiter'
    typeParameters:
    - id: T
      description: The value type carried by successful completion, including Result values for expected failures.
    content.vb: Public NotInheritable Class Task(Of T) Implements ITaskAwaiter
  inheritance:
