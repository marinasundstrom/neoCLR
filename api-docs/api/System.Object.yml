  summary: Provides an abstract common object-reference base with runtime type inspection and display behavior.
  remarks: 'Development support is bounded: GetType and virtual ToString are implemented with the limits in the Object and Value guide. Equals and GetHashCode in the compiler reference do not establish executable public API support. Object is abstract; its protected constructor initializes the base portion of a derived instance. See the Object and Value guide. Ordinary class assignment shares a reference; value assignment copies fields.'
  example: []
  syntax:
    content: public abstract class Object
    content.vb: Public MustInherit Class Object
  inheritance: []
