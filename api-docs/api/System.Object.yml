  namespace: System
  summary: Provides an abstract common object-reference base with runtime type inspection, display and bounded identity/equality behavior.
  remarks: 'Development support is bounded: GetType, ToString, ReferenceEquals, Equals and GetHashCode are implemented with the type restrictions in the Object and Value guide. String identity remains unsupported. Boxed Int32 and Boolean supply value equality/hash; named structs dispatch explicit Object overrides, including generated record-struct members. Object is abstract; its protected constructor initializes the base portion of a derived instance. See the Object and Value guide. Ordinary class assignment shares a reference; value assignment copies fields.'
  example: []
  syntax:
    content: public abstract class Object
    content.vb: Public MustInherit Class Object
  inheritance: []
  nameWithType.vb: Object
  fullName.vb: Object
  name.vb: Object
