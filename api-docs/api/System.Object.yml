  fullName.vb: Object
  name.vb: Object
- uid: System.Object.GetType
  commentId: M:System.Object.GetType
  id: GetType
  parent: System.Object
  langs:
  - csharp
  - vb
  name: GetType()
  nameWithType: object.GetType()
  fullName: object.GetType()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Returns metadata for the concrete runtime type of this instance.
  remarks: Implemented for supported class references, arrays, strings and boxed values. A null receiver raises a terminal NullReference fault. This operation does not change value/reference semantics.
  example: []
  syntax:
    content: public TypeInfo GetType()
    return:
      type: System.Introspection.TypeInfo
      description: The concrete type descriptor, preserving the type through supported base and interface views.
    content.vb: Public Function [GetType]() As TypeInfo
  overload: System.Object.GetType*
  nameWithType.vb: Object.GetType()
  fullName.vb: Object.GetType()
- uid: System.Object.ToString
  commentId: M:System.Object.ToString
  id: ToString
  parent: System.Object
  langs:
  - csharp
  - vb
  name: ToString()
  nameWithType: object.ToString()
  fullName: object.ToString()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Returns the concrete runtime type name unless an admitted class override supplies display text.
  remarks: Development class-reference slice. Virtual calls select class overrides; explicit base calls use this fallback. Rootless nominal classes and arrays use the fallback. Null raises NullReference. Virtual dispatch for boxed values and intrinsic strings is not yet supported; use their typed formatting APIs. This is display text, not serialization or a stable identity.
  example: []
  syntax:
    content: public virtual string ToString()
    return:
      type: System.String
      description: The type descriptor FullName, or the string produced by the selected override.
    content.vb: Public Overridable Function ToString() As String
  overload: System.Object.ToString*
  nameWithType.vb: Object.ToString()
  fullName.vb: Object.ToString()
