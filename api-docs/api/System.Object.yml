- uid: System.Object.ReferenceEquals(System.Object,System.Object)
  commentId: M:System.Object.ReferenceEquals(System.Object,System.Object)
  id: ReferenceEquals(System.Object,System.Object)
  parent: System.Object
  langs:
  - csharp
  - vb
  name: ReferenceEquals(object?, object?)
  nameWithType: object.ReferenceEquals(object?, object?)
  fullName: object.ReferenceEquals(object?, object?)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Tests whether two supported references denote the same allocation or are both null.
  remarks: 'The reference parameters are nullable for Raven compatibility: ReferenceEquals(Object? left, Object? right). This annotation does not introduce a distinct runtime type. Nonvirtual and independent of Equals overrides. Separate boxes remain distinct even with equal contents. Intrinsic strings and String Object wrappers raise a terminal RuntimeError until String identity is defined. Managed byref locations are not Object identity operands.'
  example: []
  syntax:
    content: public static bool ReferenceEquals(object? left, object? right)
    parameters:
    - id: left
      type: System.Object
      description: A class, array or boxed-value reference, or null.
    - id: right
      type: System.Object
      description: A class, array or boxed-value reference, or null.
    return:
      type: System.Boolean
      description: True for aliases or two nulls; false for distinct allocations or exactly one null.
    content.vb: Public Shared Function ReferenceEquals(left As Object, right As Object) As Boolean
  overload: System.Object.ReferenceEquals*
  nameWithType.vb: Object.ReferenceEquals(Object, Object)
  fullName.vb: Object.ReferenceEquals(Object, Object)
  name.vb: ReferenceEquals(Object, Object)
- uid: System.Object.Equals(System.Object)
  commentId: M:System.Object.Equals(System.Object)
  id: Equals(System.Object)
  parent: System.Object
  langs:
  - csharp
  - vb
  name: Equals(object?)
  nameWithType: object.Equals(object?)
  fullName: object.Equals(object?)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Tests reference identity by default; an ordinary class may override equality.
  remarks: 'The other parameter is nullable for Raven compatibility: Equals(Object? other). Null other returns false for a supported non-null default receiver. A null receiver raises NullReference. Class overrides must be consistent with GetHashCode: equal objects must have equal hashes. Virtual calls on boxed Int32, Int64 or Boolean compare copied values only with the same concrete type; null or another concrete type compares false. Boolean true does not equal Int32 one. Boxed named structs dispatch explicit Equals overrides; record structs generate exact-type component equality. Other boxed primitives and String equality remain unsupported. Explicit Object base calls retain reference equality. This does not add structural class equality or change Equatable contracts.'
  example: []
  syntax:
    content: public virtual bool Equals(object? other)
    parameters:
    - id: other
      type: System.Object
      description: The object to compare with this instance, or null.
    return:
      type: System.Boolean
      description: For the default class/array implementation, true only when other aliases this instance. An override supplies its own equality policy.
    content.vb: Public Overridable Function Equals(other As Object) As Boolean
  overload: System.Object.Equals*
  nameWithType.vb: Object.Equals(Object)
  fullName.vb: Object.Equals(Object)
  name.vb: Equals(Object)
- uid: System.Object.GetHashCode
  commentId: M:System.Object.GetHashCode
  id: GetHashCode
  parent: System.Object
  langs:
  - csharp
  - vb
  name: GetHashCode()
  nameWithType: object.GetHashCode()
  fullName: object.GetHashCode()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Returns a stable identity hash by default; an ordinary class may override it consistently with equality.
  remarks: The default class/array hash survives mutation and garbage collection and is shared by aliases. Collisions are allowed. It is not a unique object identifier, persisted value, native address or cross-execution contract. A null receiver raises NullReference. Virtual calls on boxed Int32 return its integer value as the hash. Boxed Int64 returns the XOR of its lower and upper 32-bit halves; equality compares the full 64-bit value. Boxed Boolean returns 1 for true and 0 for false. Boxed named structs dispatch explicit GetHashCode overrides, including generated record-struct hashes. Other boxed primitives and String identity hashes remain unsupported. Explicit Object base calls retain the identity hash. An equality override must provide a compatible hash.
  example: []
  syntax:
    content: public virtual int GetHashCode()
    return:
      type: System.Int32
      description: A signed 32-bit hash for the live object, or the hash supplied by a class override.
    content.vb: Public Overridable Function GetHashCode() As Integer
  overload: System.Object.GetHashCode*
  nameWithType.vb: Object.GetHashCode()
  fullName.vb: Object.GetHashCode()
- uid: System.Object.ToString
  commentId: M:System.Object.ToString
  id: ToString
  parent: System.Object
  langs:
  - csharp
  - vb
  name: ToString()
  nameWithType: object.ToString()
  fullName: object.ToString()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Returns the concrete runtime type name for supported references, or display text from a class or boxed-struct override.
  remarks: Development class-reference slice. Virtual calls select class overrides; explicit base calls use this fallback. Rootless nominal classes and arrays use the fallback. Null raises NullReference. Boxed named structs dispatch an explicit ToString override, including generated record-struct display. Boxed primitives without an implementation and intrinsic strings remain unsupported; use their typed formatting APIs. This is display text, not serialization or a stable identity.
  example: []
  syntax:
    content: public virtual string ToString()
    return:
      type: System.String
      description: The type descriptor FullName, or the string produced by the selected override.
    content.vb: Public Overridable Function ToString() As String
  overload: System.Object.ToString*
  nameWithType.vb: Object.ToString()
  fullName.vb: Object.ToString()
