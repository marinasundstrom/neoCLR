  namespace: System
  summary: Returns metadata for the concrete runtime type of this instance.
  remarks: Implemented for supported class references, arrays, strings and boxed values. A null receiver raises a terminal NullReference fault. This operation does not change value/reference semantics.
  example: []
  syntax:
    content: public TypeInfo GetType()
    return:
      type: System.Introspection.TypeInfo
      description: The concrete type descriptor, preserving the type through supported base and interface views.
