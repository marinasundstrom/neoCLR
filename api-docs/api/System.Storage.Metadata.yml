- uid: System.Storage.Metadata.GetKind(System.String)
  commentId: M:System.Storage.Metadata.GetKind(System.String)
  id: GetKind(System.String)
  parent: System.Storage.Metadata
  langs:
  - csharp
  - vb
  name: GetKind(string)
  nameWithType: Metadata.GetKind(string)
  fullName: System.Storage.Metadata.GetKind(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Queries whether a host path currently denotes a regular file or directory.
  remarks: Follows symbolic links. Results are observations, not stable identity or authority; later opens can fail. Empty or NUL-containing paths return InvalidPath; missing or dangling targets return NotFound; denied access returns AccessDenied; unsupported kinds return WrongKind; other I/O errors return IoFailure. Calls can block. No sandbox or permission-to-read guarantee is implied.
  example: []
  syntax:
    content: public static Result<EntryKind, StorageLookupError> GetKind(string path)
    parameters:
    - id: path
      type: System.String
      description: A native host path. Relative paths use the process working directory, not a provider root.
    return:
      type: System.Result{System.Storage.EntryKind,System.Storage.StorageLookupError}
      description: Ok with File or Directory, or a typed StorageLookupError. No resource is retained.
    content.vb: Public Shared Function GetKind(path As String) As Result(Of EntryKind, StorageLookupError)
  overload: System.Storage.Metadata.GetKind*
  nameWithType.vb: Metadata.GetKind(String)
  fullName.vb: System.Storage.Metadata.GetKind(String)
  name.vb: GetKind(String)
