  fullName: System.Introspection.AssemblyInfo.ReferencedAssemblies
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Gets descriptors for referenced assemblies already present in the loaded catalog. An unavailable reference faults; this property does not load files.
  example: []
  syntax:
