  name: AssemblyInfo
  nameWithType: AssemblyInfo
  fullName: System.Introspection.AssemblyInfo
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Describes a retained, loaded assembly in the current program.
  remarks: Development after Preview 9. Object equality compares full assembly identity; hashes use the same components. Separate wrappers can compare equal. Null and other descriptor kinds compare false. No dynamic loading or cross-program identity is supported. See the introspection guide for Object display and identity limitations.
  example: []
  syntax:
    content: public interface AssemblyInfo
    content.vb: Public Interface AssemblyInfo
- uid: System.Introspection.AssemblyInfo.GetModules
  commentId: M:System.Introspection.AssemblyInfo.GetModules
  id: GetModules
  parent: System.Introspection.AssemblyInfo
  langs:
  - csharp
  - vb
  name: GetModules()
  nameWithType: AssemblyInfo.GetModules()
  fullName: System.Introspection.AssemblyInfo.GetModules()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Gets modules belonging to this assembly.
  example: []
  syntax:
    content: Sequence<ModuleInfo> GetModules()
    return:
      type: System.Collections.Sequence{System.Introspection.ModuleInfo}
      description: A snapshot sequence of descriptors in the loaded catalog, not an inventory read from disk. Importer-discarded metadata is not restored.
    content.vb: Function GetModules() As Sequence(Of ModuleInfo)
  overload: System.Introspection.AssemblyInfo.GetModules*
