- uid: System.Streams.FileInputStream
  commentId: T:System.Streams.FileInputStream
  id: FileInputStream
  parent: System.Streams
  children:
  - System.Streams.FileInputStream.Close
  - System.Streams.FileInputStream.Open(System.String)
  - System.Streams.FileInputStream.Read(System.Byte[],System.Int32,System.Int32)
  langs:
  - csharp
  - vb
  name: FileInputStream
  nameWithType: FileInputStream
  fullName: System.Streams.FileInputStream
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: A blocking, explicitly closed file read stream. Development API, not included in Preview 9.
  remarks: Native resources belong to the invocation. Close promptly; invocation teardown closes remaining files. A retained stream cannot be reused in another invocation. There is no finalizer, automatic disposal, seeking or asynchronous scheduling in this slice.
  example: []
  syntax:
    content: 'public sealed class FileInputStream : InputStream'
    content.vb: Public NotInheritable Class FileInputStream Implements InputStream
  inheritance:
  - System.Object
  implements:
  - System.Streams.InputStream
- uid: System.Streams.FileInputStream.Open(System.String)
  commentId: M:System.Streams.FileInputStream.Open(System.String)
  id: Open(System.String)
  parent: System.Streams.FileInputStream
  langs:
  - csharp
  - vb
  name: Open(string)
  nameWithType: FileInputStream.Open(string)
  fullName: System.Streams.FileInputStream.Open(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Opens an existing regular file for reading, positioned at its beginning.
  example: []
  syntax:
    content: public static Result<FileInputStream, StreamError> Open(string path)
    parameters:
    - id: path
      type: System.String
      description: Host filesystem path; normal host permissions and symlink resolution apply.
    return:
      type: System.Result{System.Streams.FileInputStream,System.Streams.StreamError}
      description: Ok with a new input stream, or an error such as InvalidPath, NotFound, AccessDenied, WrongKind or LimitExceeded.
    content.vb: Public Shared Function Open(path As String) As Result(Of FileInputStream, StreamError)
  overload: System.Streams.FileInputStream.Open*
