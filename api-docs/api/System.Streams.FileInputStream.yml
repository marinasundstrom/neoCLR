- uid: System.Streams.FileInputStream.Read(System.Byte[],System.Int32,System.Int32)
  commentId: M:System.Streams.FileInputStream.Read(System.Byte[],System.Int32,System.Int32)
  id: Read(System.Byte[],System.Int32,System.Int32)
  parent: System.Streams.FileInputStream
  langs:
  - csharp
  - vb
  name: Read(byte[], int, int)
  nameWithType: FileInputStream.Read(byte[], int, int)
  fullName: System.Streams.FileInputStream.Read(byte[], int, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Attempts one partial read using a caller-owned byte array.
  remarks: Calls block. A read changes only the transferred range. A zero count returns zero without establishing EOF; a positive-count read returning zero means EOF. Writes may be partial; loop until all bytes have been accepted.
  example: []
  syntax:
    content: public Result<int, StreamError> Read(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: Managed byte array. Do not mutate it during the call.
    - id: offset
      type: System.Int32
      description: Zero-based start index.
    - id: count
      type: System.Int32
      description: Maximum bytes to transfer; zero through 65536, within the array range.
    return:
      type: System.Result{System.Int32,System.Streams.StreamError}
      description: Ok with the transferred count, or a typed StreamError. Invalid ranges fail before I/O.
    content.vb: Public Function Read(buffer As Byte(), offset As Integer, count As Integer) As Result(Of Integer, StreamError)
  overload: System.Streams.FileInputStream.Read*
  implements:
  - System.Streams.InputStream.Read(System.Byte[],System.Int32,System.Int32)
  nameWithType.vb: FileInputStream.Read(Byte(), Integer, Integer)
  fullName.vb: System.Streams.FileInputStream.Read(Byte(), Integer, Integer)
  name.vb: Read(Byte(), Integer, Integer)
- uid: System.Streams.FileInputStream.Close
  commentId: M:System.Streams.FileInputStream.Close
  id: Close
  parent: System.Streams.FileInputStream
  langs:
  - csharp
  - vb
  name: Close()
  nameWithType: FileInputStream.Close()
  fullName: System.Streams.FileInputStream.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Releases the open file. Repeated calls are harmless.
  remarks: Subsequent operations return Closed. Close is not a flush or durability guarantee and does not report OS close errors. Invocation teardown releases resources after an unhandled runtime fault.
  example: []
  syntax:
    content: public void Close()
    content.vb: Public Sub Close()
  overload: System.Streams.FileInputStream.Close*
  implements:
  - System.Streams.InputStream.Close
