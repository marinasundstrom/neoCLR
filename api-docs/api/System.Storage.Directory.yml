items:
- uid: System.Storage.Directory
  commentId: T:System.Storage.Directory
  id: Directory
  parent: System.Storage
  children:
  - System.Storage.Directory.FileAt(System.String)
  - System.Storage.Directory.GetDirectory(System.Storage.Path)
  - System.Storage.Directory.GetDirectory(System.String)
  - System.Storage.Directory.GetFile(System.Storage.Path)
  - System.Storage.Directory.GetFile(System.String)
  - System.Storage.Directory.GetItem(System.Storage.Path)
  - System.Storage.Directory.GetItems(System.Int32)
  langs:
  - csharp
  - vb
  name: Directory
  nameWithType: Directory
  fullName: System.Storage.Directory
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: The directory branch of StorageItem, implemented by storage providers.
  remarks: Development interface after Preview 9. Providers supply Name, Path, child-address construction and explicit relative file lookup. There is no public constructor. Current sample implementations retain provider context; no metadata cache or native filesystem identity is required. FileAt remains a transitional POC address operation. Relative GetItem/GetDirectory and bounded GetItems are now implemented. Metadata queries and asynchronous operations remain follow-ups.
  example: []
  syntax:
    content: 'public interface Directory : StorageItem'
    content.vb: Public Interface Directory Inherits StorageItem
  inheritedMembers:
  - System.Storage.StorageItem.Path
  - System.Storage.StorageItem.Name
- uid: System.Storage.Directory.GetItems(System.Int32)
  commentId: M:System.Storage.Directory.GetItems(System.Int32)
  id: GetItems(System.Int32)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetItems(int)
  nameWithType: Directory.GetItems(int)
  fullName: System.Storage.Directory.GetItems(int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Retrieves a bounded snapshot of direct child item interfaces.
  remarks: Synchronous; callers own no enumeration handle. FileSystem accepts 0 through 1024 items, bounds native child-name bytes to 64 KiB, and sorts names ordinally. Zero succeeds only for an empty directory. Listing is not atomic with child lookup; concurrent changes can fail the whole operation. Unsupported child kinds or names can fail the listing. Provider ordering and snapshot consistency can differ; no live sequence or stable identity is promised.
  example: []
  syntax:
    content: Result<Sequence<StorageItem>, StorageLookupError> GetItems(int maxItems)
    parameters:
    - id: maxItems
      type: System.Int32
      description: Maximum number of items to return. Negative values return InvalidRange; exceeding provider bounds or the requested count returns LimitExceeded.
    return:
      type: System.Result{System.Collections.Sequence{System.Storage.StorageItem},System.Storage.StorageLookupError}
      description: A Sequence of File and Directory values exposed as StorageItem, or StorageLookupError. No partial successful listing is returned.
    content.vb: Function GetItems(maxItems As Integer) As Result(Of Sequence(Of StorageItem), StorageLookupError)
  overload: System.Storage.Directory.GetItems*
  nameWithType.vb: Directory.GetItems(Integer)
  fullName.vb: System.Storage.Directory.GetItems(Integer)
  name.vb: GetItems(Integer)
- uid: System.Storage.Directory.GetItem(System.Storage.Path)
  commentId: M:System.Storage.Directory.GetItem(System.Storage.Path)
  id: GetItem(System.Storage.Path)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetItem(Path)
  nameWithType: Directory.GetItem(Path)
  fullName: System.Storage.Directory.GetItem(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Resolves an existing file or directory relative to this directory.
  example: []
  syntax:
    content: Result<StorageItem, StorageLookupError> GetItem(Path relativePath)
    parameters:
    - id: relativePath
      type: System.Storage.Path
      description: A relative Path; absolute inputs return InvalidPath and dot refers to this directory.
    return:
      type: System.Result{System.Storage.StorageItem,System.Storage.StorageLookupError}
      description: A provider-owned StorageItem or StorageLookupError.
    content.vb: Function GetItem(relativePath As Path) As Result(Of StorageItem, StorageLookupError)
  overload: System.Storage.Directory.GetItem*
- uid: System.Storage.Directory.GetDirectory(System.String)
  commentId: M:System.Storage.Directory.GetDirectory(System.String)
  id: GetDirectory(System.String)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetDirectory(string)
  nameWithType: Directory.GetDirectory(string)
  fullName: System.Storage.Directory.GetDirectory(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up one direct child directory.
  example: []
  syntax:
    content: Result<Directory, StorageLookupError> GetDirectory(string name)
    parameters:
    - id: name
      type: System.String
      description: One valid child name; nested strings and dot/parent names return InvalidPath.
    return:
      type: System.Result{System.Storage.Directory,System.Storage.StorageLookupError}
      description: A Directory or the provider lookup error.
    content.vb: Function GetDirectory(name As String) As Result(Of Directory, StorageLookupError)
  overload: System.Storage.Directory.GetDirectory*
  nameWithType.vb: Directory.GetDirectory(String)
  fullName.vb: System.Storage.Directory.GetDirectory(String)
  name.vb: GetDirectory(String)
- uid: System.Storage.Directory.GetDirectory(System.Storage.Path)
  commentId: M:System.Storage.Directory.GetDirectory(System.Storage.Path)
  id: GetDirectory(System.Storage.Path)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetDirectory(Path)
  nameWithType: Directory.GetDirectory(Path)
  fullName: System.Storage.Directory.GetDirectory(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up a directory by a relative logical path.
  example: []
  syntax:
    content: Result<Directory, StorageLookupError> GetDirectory(Path relativePath)
    parameters:
    - id: relativePath
      type: System.Storage.Path
      description: Relative path allowing nested segments; absolute inputs return InvalidPath and dot resolves this directory.
    return:
      type: System.Result{System.Storage.Directory,System.Storage.StorageLookupError}
      description: A Directory or StorageLookupError.
    content.vb: Function GetDirectory(relativePath As Path) As Result(Of Directory, StorageLookupError)
  overload: System.Storage.Directory.GetDirectory*
- uid: System.Storage.Directory.FileAt(System.String)
  commentId: M:System.Storage.Directory.FileAt(System.String)
  id: FileAt(System.String)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: FileAt(string)
  nameWithType: Directory.FileAt(string)
  fullName: System.Storage.Directory.FileAt(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Constructs a direct-child file address without performing I/O.
  remarks: Use this for a future destination. It does not check existence, open a stream or create a file. The error family is StorageLookupError rather than the earlier sample FileReadError.
  example: []
  syntax:
    content: Result<File, StorageLookupError> FileAt(string name)
    parameters:
    - id: name
      type: System.String
      description: One nonempty child name, excluding separators, dot/parent segments and other invalid Path characters.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A File using this provider, or StorageLookupError.InvalidPath.
    content.vb: Function FileAt(name As String) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.FileAt*
  nameWithType.vb: Directory.FileAt(String)
  fullName.vb: System.Storage.Directory.FileAt(String)
  name.vb: FileAt(String)
- uid: System.Storage.Directory.GetFile(System.String)
  commentId: M:System.Storage.Directory.GetFile(System.String)
  id: GetFile(System.String)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetFile(string)
  nameWithType: Directory.GetFile(string)
  fullName: System.Storage.Directory.GetFile(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Validates one child name and explicitly looks up its file.
  remarks: Equivalent to resolving FileAt and querying StorageProvider.GetFile; it owns no stream.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(string name)
    parameters:
    - id: name
      type: System.String
      description: One direct child name, not a relative path containing separators.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A provider-bound File, InvalidPath for an invalid name, or the provider lookup error unchanged.
    content.vb: Function GetFile(name As String) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.GetFile*
  nameWithType.vb: Directory.GetFile(String)
  fullName.vb: System.Storage.Directory.GetFile(String)
  name.vb: GetFile(String)
- uid: System.Storage.Directory.GetFile(System.Storage.Path)
  commentId: M:System.Storage.Directory.GetFile(System.Storage.Path)
  id: GetFile(System.Storage.Path)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetFile(Path)
  nameWithType: Directory.GetFile(Path)
  fullName: System.Storage.Directory.GetFile(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Resolves a relative logical path in this directory and looks up its file.
  remarks: Dot queries this directory address as a file, normally WrongKind. Resolution preserves the provider and prefix; it does not normalize, enforce parent existence or create a security sandbox.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(Path relativePath)
    parameters:
    - id: relativePath
      type: System.Storage.Path
      description: Relative Path; nested segments are supported, absolute inputs are rejected.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A provider-bound File, InvalidPath for an absolute input, or the provider lookup error unchanged.
    content.vb: Function GetFile(relativePath As Path) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.GetFile*
