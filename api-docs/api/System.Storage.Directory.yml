  namespace: System.Storage
  summary: A provider-bound directory address for child resolution and explicit file lookup.
  remarks: Development API. Construction does not create or verify a directory. No metadata is cached. Parent existence, enumeration, timestamps and stable identity are outside this initial contract. See the [descriptor guide](/docs/storage-items.html).
