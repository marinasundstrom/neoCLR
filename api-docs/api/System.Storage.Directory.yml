items:
- uid: System.Storage.Directory
  commentId: T:System.Storage.Directory
  id: Directory
  parent: System.Storage
  children:
  - System.Storage.Directory.FileAt(System.String)
  - System.Storage.Directory.GetFile(System.Storage.Path)
  - System.Storage.Directory.GetFile(System.String)
  langs:
  - csharp
  - vb
  name: Directory
  nameWithType: Directory
  fullName: System.Storage.Directory
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: The directory branch of StorageItem, implemented by storage providers.
  remarks: Development interface after Preview 9. Providers supply Name, Path, child-address construction and explicit relative file lookup. There is no public constructor. Current sample implementations retain provider context; no metadata cache or native filesystem identity is required. FileAt remains a transitional POC address operation. GetItem, GetDirectory and GetItems are follow-up work, not implemented members.
  example: []
  syntax:
    content: 'public interface Directory : StorageItem'
    content.vb: Public Interface Directory Inherits StorageItem
  inheritedMembers:
  - System.Storage.StorageItem.Path
  - System.Storage.StorageItem.Name
- uid: System.Storage.Directory.FileAt(System.String)
  commentId: M:System.Storage.Directory.FileAt(System.String)
  id: FileAt(System.String)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: FileAt(string)
  nameWithType: Directory.FileAt(string)
  fullName: System.Storage.Directory.FileAt(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Constructs a direct-child file address without performing I/O.
  remarks: Use this for a future destination. It does not check existence, open a stream or create a file. The error family is StorageLookupError rather than the earlier sample FileReadError.
  example: []
  syntax:
    content: Result<File, StorageLookupError> FileAt(string name)
    parameters:
    - id: name
      type: System.String
      description: One nonempty child name, excluding separators, dot/parent segments and other invalid Path characters.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A File using this provider, or StorageLookupError.InvalidPath.
    content.vb: Function FileAt(name As String) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.FileAt*
  nameWithType.vb: Directory.FileAt(String)
  fullName.vb: System.Storage.Directory.FileAt(String)
  name.vb: FileAt(String)
- uid: System.Storage.Directory.GetFile(System.String)
  commentId: M:System.Storage.Directory.GetFile(System.String)
  id: GetFile(System.String)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetFile(string)
  nameWithType: Directory.GetFile(string)
  fullName: System.Storage.Directory.GetFile(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Validates one child name and explicitly looks up its file.
  remarks: Equivalent to resolving FileAt and querying StorageLookup.GetFile; it owns no stream.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(string name)
    parameters:
    - id: name
      type: System.String
      description: One direct child name, not a relative path containing separators.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A provider-bound File, InvalidPath for an invalid name, or the provider lookup error unchanged.
    content.vb: Function GetFile(name As String) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.GetFile*
  nameWithType.vb: Directory.GetFile(String)
  fullName.vb: System.Storage.Directory.GetFile(String)
  name.vb: GetFile(String)
- uid: System.Storage.Directory.GetFile(System.Storage.Path)
  commentId: M:System.Storage.Directory.GetFile(System.Storage.Path)
  id: GetFile(System.Storage.Path)
  parent: System.Storage.Directory
  langs:
  - csharp
  - vb
  name: GetFile(Path)
  nameWithType: Directory.GetFile(Path)
  fullName: System.Storage.Directory.GetFile(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Resolves a relative logical path in this directory and looks up its file.
  remarks: Dot queries this directory address as a file, normally WrongKind. Resolution preserves the provider and prefix; it does not normalize, enforce parent existence or create a security sandbox.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(Path relativePath)
    parameters:
    - id: relativePath
      type: System.Storage.Path
      description: Relative Path; nested segments are supported, absolute inputs are rejected.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A provider-bound File, InvalidPath for an absolute input, or the provider lookup error unchanged.
    content.vb: Function GetFile(relativePath As Path) As Result(Of File, StorageLookupError)
  overload: System.Storage.Directory.GetFile*
