  name: Thread
  nameWithType: Thread
  fullName: System.Concurrency.Thread
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: An explicit, isolated host thread with a retained completion task.
  remarks: Development after Preview 9. Accepts an uncaptured string-to-string callback. Construction selects the completion queue but does not start work. Guest objects do not cross thread boundaries.
  example: []
  syntax:
    content: public sealed class Thread
    content.vb: Public NotInheritable Class Thread
  inheritance:
