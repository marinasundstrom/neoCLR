  - vb
  name: Thread(Func<string, string>, string)
  nameWithType: Thread.Thread(Func<string, string>, string)
  fullName: System.Concurrency.Thread.Thread(System.Func<string, string>, string)
  type: Constructor
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Creates an unstarted thread and its pending completion task.
  remarks: The active TaskQueue, or the invocation default, is selected at construction. A never-started thread allocates no native thread.
  example: []
  syntax:
    content: public Thread(Func<string, string> callback, string input)
    parameters:
    - id: callback
      type: System.Func{System.String,System.String}
      description: A static function with no captured receiver, taking copied input text and returning result text.
    - id: input
      type: System.String
      description: Text copied into the isolated worker invocation.
    content.vb: Public Sub New(callback As Func(Of String, String), input As String)
