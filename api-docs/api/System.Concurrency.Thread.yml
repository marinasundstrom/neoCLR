- uid: System.Concurrency.Thread.Start
  commentId: M:System.Concurrency.Thread.Start
  id: Start
  parent: System.Concurrency.Thread
  langs:
  - csharp
  - vb
  name: Start()
  nameWithType: Thread.Start()
  fullName: System.Concurrency.Thread.Start()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Starts this thread once.
  remarks: A second call faults. The callback must be static and cannot capture guest state. Completion is dispatched on the queue selected at construction; its queued join may block.
  example: []
  syntax:
    content: public void Start()
    content.vb: Public Sub Start()
  overload: System.Concurrency.Thread.Start*
- uid: System.Concurrency.Thread.Run(System.Func{System.String,System.String},System.String)
  commentId: M:System.Concurrency.Thread.Run(System.Func{System.String,System.String},System.String)
  id: Run(System.Func{System.String,System.String},System.String)
  parent: System.Concurrency.Thread
  langs:
  - csharp
  - vb
  name: Run(Func<string, string>, string)
  nameWithType: Thread.Run(Func<string, string>, string)
  fullName: System.Concurrency.Thread.Run(System.Func<string, string>, string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Creates and starts a dedicated thread and returns its completion task.
  remarks: Equivalent to construction, Start, and reading Task. This is explicit thread creation, not the planned platform-selected Task.Run API.
  example: []
  syntax:
    content: public static Task<string> Run(Func<string, string> callback, string input)
    parameters:
    - id: callback
      type: System.Func{System.String,System.String}
      description: A static function with no captured receiver, taking copied input text and returning result text.
    - id: input
      type: System.String
      description: Text copied into the isolated worker invocation.
    return:
      type: System.Tasks.Task{System.String}
      description: A task for the copied result text, completed on the selected dispatcher.
    content.vb: Public Shared Function Run(callback As Func(Of String, String), input As String) As Task(Of String)
  overload: System.Concurrency.Thread.Run*
  nameWithType.vb: Thread.Run(Func(Of String, String), String)
  fullName.vb: System.Concurrency.Thread.Run(System.Func(Of String, String), String)
  name.vb: Run(Func(Of String, String), String)
- uid: System.Concurrency.Thread.Task
  commentId: P:System.Concurrency.Thread.Task
  id: Task
  parent: System.Concurrency.Thread
  langs:
