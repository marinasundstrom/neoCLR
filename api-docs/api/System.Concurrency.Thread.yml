  inheritedMembers:
  - System.Object.GetType
- uid: System.Concurrency.Thread.#ctor(System.Func{System.String,System.String},System.String)
  commentId: M:System.Concurrency.Thread.#ctor(System.Func{System.String,System.String},System.String)
  id: '#ctor(System.Func{System.String,System.String},System.String)'
  parent: System.Concurrency.Thread
  langs:
