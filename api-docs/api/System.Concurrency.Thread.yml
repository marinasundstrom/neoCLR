  name: Task
  nameWithType: Thread.Task
  fullName: System.Concurrency.Thread.Task
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Gets the stable task containing the callback result after thread termination.
  remarks: Pending before Start. Successful completion includes native thread cleanup. Callback faults terminate the invocation rather than producing a faulted task.
  example: []
  syntax:
    content: public Task<string> Task { get; }
    parameters: []
    return:
      type: System.Tasks.Task{System.String}
    content.vb: Public ReadOnly Property Task As Task(Of String)
  overload: System.Concurrency.Thread.Task*
