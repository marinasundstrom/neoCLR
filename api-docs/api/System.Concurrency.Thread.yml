  fullName: System.Concurrency.Thread.IsStarted
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Gets whether native thread submission has succeeded.
  remarks: Remains true after termination. This is not a running-state property.
  example: []
  syntax:
    content: public bool IsStarted { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsStarted As Boolean
  overload: System.Concurrency.Thread.IsStarted*
