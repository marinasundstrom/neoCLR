  langs:
  - csharp
  - vb
  name: ParameterInfo
  nameWithType: ParameterInfo
  fullName: System.Introspection.ParameterInfo
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Describes an explicit method parameter or property index parameter in the loaded program.
  remarks: Development after Preview 9. Object equality compares the closed declaring type, owner kind and definition index, and zero-based parameter position. Matching names, types or tokens alone are insufficient. Hashes agree for equal parameters; ToString returns Name, which may be empty. Owner identity is retained internally; a public Member property, return parameters, defaults and custom attributes are not implemented.
  example: []
  syntax:
    content: public interface ParameterInfo
    content.vb: Public Interface ParameterInfo
- uid: System.Introspection.ParameterInfo.MetadataToken
  commentId: P:System.Introspection.ParameterInfo.MetadataToken
  id: MetadataToken
  parent: System.Introspection.ParameterInfo
  langs:
  - csharp
  - vb
  name: MetadataToken
  nameWithType: ParameterInfo.MetadataToken
  fullName: System.Introspection.ParameterInfo.MetadataToken
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Gets the source parameter token, or zero when no Param row was retained. This token is scoped and is not the equality key. Property index snapshots currently report the selected accessor parameter token.
  example: []
  syntax:
    content: int MetadataToken { get; }
    parameters: []
    return:
      type: System.Int32
    content.vb: ReadOnly Property MetadataToken As Integer
  overload: System.Introspection.ParameterInfo.MetadataToken*
