### YamlMime:ManagedReference
items:
- uid: System.Storage.StorageProvider
  commentId: T:System.Storage.StorageProvider
  id: StorageProvider
  parent: System.Storage
  children:
  - System.Storage.StorageProvider.CreateNew(System.Storage.Path)
  - System.Storage.StorageProvider.OpenRead(System.Storage.Path)
  langs:
  - csharp
  - vb
  name: StorageProvider
  nameWithType: StorageProvider
  fullName: System.Storage.StorageProvider
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Opens directional byte streams at validated logical storage paths.
  remarks: Development API after Preview 9. Implementations resolve Path in their own address space. Parsing validates syntax only; it does not grant access or establish existence. Operations are synchronous and may block. The caller closes each successful stream. This contract requires neither text helpers nor descriptor lookup. See the [provider guide](/docs/storage-provider.html).
  example: []
  syntax:
    content: public interface StorageProvider
    content.vb: Public Interface StorageProvider
- uid: System.Storage.StorageProvider.OpenRead(System.Storage.Path)
  commentId: M:System.Storage.StorageProvider.OpenRead(System.Storage.Path)
  id: OpenRead(System.Storage.Path)
  parent: System.Storage.StorageProvider
  langs:
  - csharp
  - vb
  name: OpenRead(Path)
  nameWithType: StorageProvider.OpenRead(Path)
  fullName: System.Storage.StorageProvider.OpenRead(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Opens an existing file for byte reads starting at offset zero.
  remarks: A successful open owns a separate cursor and requires Close. An accepted Path can still be unsupported by a provider. Subsequent reads may fail; concurrent modification and replacement visibility depend on the provider.
  example: []
  syntax:
    content: Result<InputStream, StreamError> OpenRead(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical address interpreted by this provider.
    return:
      type: System.Result{System.Streams.InputStream,System.Streams.StreamError}
      description: A new InputStream, or a StreamError such as NotFound, AccessDenied, WrongKind, InvalidPath, LimitExceeded or IoFailure.
    content.vb: Function OpenRead(path As Path) As Result(Of InputStream, StreamError)
  overload: System.Storage.StorageProvider.OpenRead*
- uid: System.Storage.StorageProvider.CreateNew(System.Storage.Path)
  commentId: M:System.Storage.StorageProvider.CreateNew(System.Storage.Path)
  id: CreateNew(System.Storage.Path)
  parent: System.Storage.StorageProvider
  langs:
  - csharp
  - vb
  name: CreateNew(Path)
  nameWithType: StorageProvider.CreateNew(Path)
  fullName: System.Storage.StorageProvider.CreateNew(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Exclusively creates an empty file and opens it for byte writes.
  remarks: Existing entries must not be overwritten. Successful creation is visible even before writing. Close the stream after use. A later write failure does not roll back creation or earlier writes. Parent creation, replacement and durable flushing are not promised.
  example: []
  syntax:
    content: Result<OutputStream, StreamError> CreateNew(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated destination address interpreted by this provider.
    return:
      type: System.Result{System.Streams.OutputStream,System.Streams.StreamError}
      description: A new OutputStream, or a StreamError such as AlreadyExists, NotFound, AccessDenied, WrongKind, InvalidPath, LimitExceeded or IoFailure.
    content.vb: Function CreateNew(path As Path) As Result(Of OutputStream, StreamError)
  overload: System.Storage.StorageProvider.CreateNew*
