items:
- uid: System.Storage.StorageProvider
  commentId: T:System.Storage.StorageProvider
  id: StorageProvider
  parent: System.Storage
  children:
  - System.Storage.StorageProvider.GetDirectory(System.Storage.Path)
  - System.Storage.StorageProvider.GetFile(System.Storage.Path)
  - System.Storage.StorageProvider.GetItem(System.Storage.Path)
  langs:
  - csharp
  - vb
  name: StorageProvider
  nameWithType: StorageProvider
  fullName: System.Storage.StorageProvider
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Resolves logical storage addresses to provider-implemented item interfaces.
  remarks: Development API after Preview 9. GetItem returns StorageItem; typed lookup returns File or Directory. Calls are synchronous and may block. Lookup observes current existence and kind without creating an entry or retaining an open content stream. Implementations own identity and byte access; this contract requires no byte-opening or text helper methods. Parsing does not grant access. Replaces the transitional StorageLookup and byte-provider split. See the [provider guide](/docs/storage-provider.html).
  example: []
  syntax:
    content: public interface StorageProvider
    content.vb: Public Interface StorageProvider
- uid: System.Storage.StorageProvider.GetItem(System.Storage.Path)
  commentId: M:System.Storage.StorageProvider.GetItem(System.Storage.Path)
  id: GetItem(System.Storage.Path)
  parent: System.Storage.StorageProvider
  langs:
  - csharp
  - vb
  name: GetItem(Path)
  nameWithType: StorageProvider.GetItem(Path)
  fullName: System.Storage.StorageProvider.GetItem(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up a file or directory without requiring its kind in advance.
  remarks: Does not create entries or open content. An unsupported native entry kind can return WrongKind. Success does not guarantee later access or stable identity. Consumers can inspect the closed File/Directory branches without depending on concrete implementation classes.
  example: []
  syntax:
    content: Result<StorageItem, StorageLookupError> GetItem(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical address interpreted by this provider.
    return:
      type: System.Result{System.Storage.StorageItem,System.Storage.StorageLookupError}
      description: A provider-owned File or Directory through StorageItem, or StorageLookupError such as NotFound, AccessDenied, InvalidPath or IoFailure.
    content.vb: Function GetItem(path As Path) As Result(Of StorageItem, StorageLookupError)
  overload: System.Storage.StorageProvider.GetItem*
- uid: System.Storage.StorageProvider.GetFile(System.Storage.Path)
  commentId: M:System.Storage.StorageProvider.GetFile(System.Storage.Path)
  id: GetFile(System.Storage.Path)
  parent: System.Storage.StorageProvider
  langs:
  - csharp
  - vb
  name: GetFile(Path)
  nameWithType: StorageProvider.GetFile(Path)
  fullName: System.Storage.StorageProvider.GetFile(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up an existing file and returns its provider-bound descriptor.
  remarks: Must not create the file or retain an open stream. Provider-specific aliases and concurrent changes do not establish stable item identity.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical file address.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A File retaining this provider and address, or StorageLookupError such as NotFound, WrongKind, AccessDenied, InvalidPath or IoFailure.
    content.vb: Function GetFile(path As Path) As Result(Of File, StorageLookupError)
  overload: System.Storage.StorageProvider.GetFile*
- uid: System.Storage.StorageProvider.GetDirectory(System.Storage.Path)
  commentId: M:System.Storage.StorageProvider.GetDirectory(System.Storage.Path)
  id: GetDirectory(System.Storage.Path)
  parent: System.Storage.StorageProvider
  langs:
  - csharp
  - vb
  name: GetDirectory(Path)
  nameWithType: StorageProvider.GetDirectory(Path)
  fullName: System.Storage.StorageProvider.GetDirectory(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up an existing directory and returns its provider-owned interface.
  remarks: 'Synchronous; may block. Does not create directories or retain an open stream. Success observes current kind, not stable identity or guaranteed later access. Providers define their directory model: the sample memory provider exposes only its root.'
  example: []
  syntax:
    content: Result<Directory, StorageLookupError> GetDirectory(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical directory address interpreted by this provider.
    return:
      type: System.Result{System.Storage.Directory,System.Storage.StorageLookupError}
      description: A Directory retaining its provider context and logical address, or StorageLookupError such as NotFound, WrongKind, AccessDenied, InvalidPath or IoFailure.
    content.vb: Function GetDirectory(path As Path) As Result(Of Directory, StorageLookupError)
  overload: System.Storage.StorageProvider.GetDirectory*
