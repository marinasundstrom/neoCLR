  summary: Temporary reference-type builder sharing completion and suspended-state ownership.
  remarks: Compiler support, not a permanent application abstraction. The importer specializes ref startup and await registration for admitted non-generic state machines. The existing heap policy remains the default. See the async builder guide for limits and ownership.
