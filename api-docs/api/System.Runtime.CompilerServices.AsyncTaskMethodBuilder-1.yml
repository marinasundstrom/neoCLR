  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Runtime.CompilerServices
  summary: Registers a continuation using one retained owner for the suspended state.
  remarks: Subsequent suspensions reuse the same state owner. The importer validates and specializes this temporary compiler-facing protocol.
  example: []
  syntax:
    content: 'public void AwaitOnCompleted<TAwaiter, TState>(ref TAwaiter awaiter, ref TState stateMachine) where TAwaiter : ITaskAwaiter where TState : IAsyncStateMachine'
    parameters:
    - id: awaiter
      type: '{TAwaiter}'
      description: Awaiter storage; no managed reference escapes.
    - id: stateMachine
      type: '{TState}'
      description: Current state, copied into a box on first suspension when it is a value type.
    typeParameters:
    - id: TAwaiter
      description: Currently an admitted target Task awaiter.
    - id: TState
      description: An admitted non-generic application state machine.
    content.vb: Public Sub AwaitOnCompleted(Of TAwaiter As ITaskAwaiter, TState As IAsyncStateMachine)(awaiter As TAwaiter, stateMachine As TState)
  overload: System.Runtime.CompilerServices.AsyncTaskMethodBuilder`1.AwaitOnCompleted*
