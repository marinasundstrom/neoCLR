- uid: System.IO.FileInputStream.GetPosition
  commentId: M:System.IO.FileInputStream.GetPosition
  id: GetPosition
  parent: System.IO.FileInputStream
  langs:
  - csharp
  - vb
  name: GetPosition()
  nameWithType: FileInputStream.GetPosition()
  fullName: System.IO.FileInputStream.GetPosition()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reports the current absolute byte position.
  remarks: Closed streams return Closed. Positions outside the representable range return LimitExceeded. This is not a decoded-character position.
  example: []
  syntax:
    content: public Result<long, StreamError> GetPosition()
    return:
      type: System.Result{System.Int64,System.IO.StreamError}
      description: The nonnegative position as Int64, or StreamError.
    content.vb: Public Function GetPosition() As Result(Of Long, StreamError)
  overload: System.IO.FileInputStream.GetPosition*
  implements:
  - System.IO.SeekableStream.GetPosition
- uid: System.IO.FileInputStream.Seek(System.Int64)
  commentId: M:System.IO.FileInputStream.Seek(System.Int64)
  id: Seek(System.Int64)
  parent: System.IO.FileInputStream
  langs:
  - csharp
  - vb
  name: Seek(long)
  nameWithType: FileInputStream.Seek(long)
  fullName: System.IO.FileInputStream.Seek(long)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Sets the absolute byte position without changing file contents.
  remarks: Closed is checked first. Negative positions return InvalidRange without moving the cursor. Reading beyond EOF returns zero. Seeking does not reset a separate text reader's state; close a leave-open reader before independently repositioning and constructing a new reader.
  example: []
  syntax:
    content: public Result<long, StreamError> Seek(long position)
    parameters:
    - id: position
      type: System.Int64
      description: Nonnegative absolute byte offset. FileInputStream permits positions beyond EOF.
    return:
      type: System.Result{System.Int64,System.IO.StreamError}
      description: The resulting position or StreamError.
    content.vb: Public Function Seek(position As Long) As Result(Of Long, StreamError)
  overload: System.IO.FileInputStream.Seek*
  implements:
  - System.IO.SeekableStream.Seek(System.Int64)
  nameWithType.vb: FileInputStream.Seek(Long)
  fullName.vb: System.IO.FileInputStream.Seek(Long)
  name.vb: Seek(Long)
- uid: System.IO.FileInputStream.Open(System.String)
  commentId: M:System.IO.FileInputStream.Open(System.String)
  id: Open(System.String)
  parent: System.IO.FileInputStream
  langs:
  - csharp
  - vb
  name: Open(string)
  nameWithType: FileInputStream.Open(string)
  fullName: System.IO.FileInputStream.Open(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Opens an existing regular file for reading, positioned at its beginning.
  example: []
  syntax:
    content: public static Result<FileInputStream, StreamError> Open(string path)
    parameters:
    - id: path
      type: System.String
      description: Host filesystem path; normal host permissions and symlink resolution apply.
    return:
      type: System.Result{System.IO.FileInputStream,System.IO.StreamError}
      description: Ok with a new input stream, or an error such as InvalidPath, NotFound, AccessDenied, WrongKind or LimitExceeded.
    content.vb: Public Shared Function Open(path As String) As Result(Of FileInputStream, StreamError)
  overload: System.IO.FileInputStream.Open*
  nameWithType.vb: FileInputStream.Open(String)
  fullName.vb: System.IO.FileInputStream.Open(String)
  name.vb: Open(String)
- uid: System.IO.FileInputStream.Read(System.Byte[],System.Int32,System.Int32)
  commentId: M:System.IO.FileInputStream.Read(System.Byte[],System.Int32,System.Int32)
  id: Read(System.Byte[],System.Int32,System.Int32)
  parent: System.IO.FileInputStream
  langs:
  - csharp
  - vb
  name: Read(byte[], int, int)
  nameWithType: FileInputStream.Read(byte[], int, int)
  fullName: System.IO.FileInputStream.Read(byte[], int, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Attempts one partial read using a caller-owned byte array.
  remarks: Calls block. A read changes only the transferred range. A zero count returns zero without establishing EOF; a positive-count read returning zero means EOF. Writes may be partial; loop until all bytes have been accepted.
  example: []
  syntax:
    content: public Result<int, StreamError> Read(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: Managed byte array. Do not mutate it during the call.
    - id: offset
      type: System.Int32
      description: Zero-based start index.
    - id: count
      type: System.Int32
      description: Maximum bytes to transfer; zero through 65536, within the array range.
    return:
      type: System.Result{System.Int32,System.IO.StreamError}
      description: Ok with the transferred count, or a typed StreamError. Invalid ranges fail before I/O.
    content.vb: Public Function Read(buffer As Byte(), offset As Integer, count As Integer) As Result(Of Integer, StreamError)
  overload: System.IO.FileInputStream.Read*
  implements:
  - System.IO.InputStream.Read(System.Byte[],System.Int32,System.Int32)
  nameWithType.vb: FileInputStream.Read(Byte(), Integer, Integer)
  fullName.vb: System.IO.FileInputStream.Read(Byte(), Integer, Integer)
  name.vb: Read(Byte(), Integer, Integer)
- uid: System.IO.FileInputStream.Close
  commentId: M:System.IO.FileInputStream.Close
  id: Close
  parent: System.IO.FileInputStream
  langs:
  - csharp
  - vb
  name: Close()
  nameWithType: FileInputStream.Close()
  fullName: System.IO.FileInputStream.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Releases the open file. Repeated calls are harmless.
  remarks: Subsequent operations return Closed. Close is not a flush or durability guarantee and does not report OS close errors. Invocation teardown releases resources after an unhandled runtime fault.
  example: []
  syntax:
    content: public void Close()
    content.vb: Public Sub Close()
  overload: System.IO.FileInputStream.Close*
  implements:
  - System.IO.InputStream.Close
