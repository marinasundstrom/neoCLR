  name: FileInputStream
  nameWithType: FileInputStream
  fullName: System.IO.FileInputStream
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: A blocking, explicitly closed file read stream. Development API, not included in Preview 9.
  remarks: Native resources belong to the invocation. Close promptly; invocation teardown closes remaining files. A retained stream cannot be reused in another invocation. There is no finalizer, automatic disposal or asynchronous scheduling in this slice. FileInputStream additionally implements SeekableStream; FileOutputStream remains sequential.
  example: []
  syntax:
    content: 'public sealed class FileInputStream : InputStream, SeekableStream'
    content.vb: Public NotInheritable Class FileInputStream Implements InputStream, SeekableStream
  inheritance:
  - System.Object
  implements:
  - System.IO.InputStream
  - System.IO.SeekableStream
  inheritedMembers:
