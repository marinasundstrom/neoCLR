  fullName: System.Storage.StorageItem.Path
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Gets this item's logical address in its provider namespace.
  remarks: Represented state, without performing a new storage query. A path alone is not authority, stable identity or a guarantee of subsequent access.
  example: []
  syntax:
    content: Path Path { get; }
    parameters: []
