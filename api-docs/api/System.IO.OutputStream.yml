  langs:
  - csharp
  - vb
  name: OutputStream
  nameWithType: OutputStream
  fullName: System.IO.OutputStream
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: A synchronous output capability implemented by platform file streams and application providers. Development API after Preview 9.
  remarks: Caller-owned arrays, partial transfers, explicit idempotent Close and typed errors. No seeking, scheduling or automatic disposal is implied. The interface does not impose native file lifetime on memory implementations.
  example: []
  syntax:
    content: public interface OutputStream
    content.vb: Public Interface OutputStream
  seealso:
  - linkType: HRef
    linkId: ../streams.html#capability-contracts
    altText: Capability contracts and Flush reference
  derivedClasses:
  - System.IO.FileOutputStream
- uid: System.IO.OutputStream.Write(System.Byte[],System.Int32,System.Int32)
  commentId: M:System.IO.OutputStream.Write(System.Byte[],System.Int32,System.Int32)
  id: Write(System.Byte[],System.Int32,System.Int32)
  parent: System.IO.OutputStream
  langs:
  - csharp
  - vb
  name: Write(byte[], int, int)
  nameWithType: OutputStream.Write(byte[], int, int)
  fullName: System.IO.OutputStream.Write(byte[], int, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Attempts one synchronous partial write.
  remarks: The buffer is not modified. A positive-count successful write must make progress; callers loop over partial writes. Calls do not suspend. No concurrency safety is promised.
  example: []
  syntax:
    content: Result<int, StreamError> Write(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: Caller-owned byte array; retained only for the duration of this call.
    - id: offset
      type: System.Int32
      description: Zero-based start within the array.
    - id: count
      type: System.Int32
      description: Maximum bytes to transfer, from zero through 65536 and within the array range.
    return:
      type: System.Result{System.Int32,System.IO.StreamError}
      description: Ok with the transferred count, or StreamError. Closed is checked before range validation; invalid ranges and oversized requests fail before transfer.
    content.vb: Function Write(buffer As Byte(), offset As Integer, count As Integer) As Result(Of Integer, StreamError)
  overload: System.IO.OutputStream.Write*
  nameWithType.vb: OutputStream.Write(Byte(), Integer, Integer)
  fullName.vb: System.IO.OutputStream.Write(Byte(), Integer, Integer)
  name.vb: Write(Byte(), Integer, Integer)
- uid: System.IO.OutputStream.Close
  commentId: M:System.IO.OutputStream.Close
  id: Close
  parent: System.IO.OutputStream
  langs:
  - csharp
  - vb
  name: Close()
  nameWithType: OutputStream.Close()
  fullName: System.IO.OutputStream.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Closes this stream; repeated calls are harmless.
  remarks: Subsequent transfers return Closed. This no-result operation does not report close failures or promise flush/durability. Other streams opened separately retain their own lifetime.
  example: []
  syntax:
    content: void Close()
    content.vb: Sub Close()
  overload: System.IO.OutputStream.Close*
