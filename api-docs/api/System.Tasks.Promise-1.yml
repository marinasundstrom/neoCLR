  namespace: System.Tasks
  summary: Producer authority to complete or cancel one task.
  remarks: The first successful terminal operation wins. Subsequent Complete or Cancel calls return false. Continuations are queued. This is not a thread-safe shared-memory primitive or a cancellation-token source.
  example: []
  syntax:
    content: public sealed class Promise<T>
    typeParameters:
    - id: T
      description: The value type carried by successful completion, including Result values for expected failures.
