  namespace: System.Tasks
  summary: Cancels a pending task and posts its registered callbacks.
  remarks: This changes the promise state. It does not stop a worker or cancel the host invocation. Awaiting a cancelled input propagates cancellation to the enclosing async task.
  example: []
  syntax:
    content: public bool Cancel()
    return:
      type: System.Boolean
      description: True if this call cancelled the task; false if it was already completed or cancelled.
    content.vb: Public Function Cancel() As Boolean
