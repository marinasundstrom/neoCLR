  summary: Defines typed equality without imposing nullable or optional operands.
  remarks: Equals takes T, not T?. A reference implementation need not accept null through this contract. Object.Equals(Object?) is a separate, explicitly null-aware boundary. Absence in domain APIs is represented with Option when needed.
