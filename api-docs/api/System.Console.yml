- uid: System.Console.OpenStandardInput
  commentId: M:System.Console.OpenStandardInput
  id: OpenStandardInput
  parent: System.Console
  langs:
  - csharp
  - vb
  name: OpenStandardInput()
  nameWithType: Console.OpenStandardInput()
  fullName: System.Console.OpenStandardInput()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Opens a non-owning byte-stream wrapper for standard input.
  remarks: Each call creates an independent wrapper; Close closes only the wrapper. Input may return a one-byte short read. Calls are synchronous; operations are limited to 65536 bytes.
  example: []
  syntax:
    content: public static InputStream OpenStandardInput()
    return:
      type: System.IO.InputStream
      description: An InputStream for input or OutputStream for either output channel.
    content.vb: Public Shared Function OpenStandardInput() As InputStream
  overload: System.Console.OpenStandardInput*
