  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Writes text without a line ending to stdout.
  remarks: Flushes before returning. Output failure is a terminal Fault. For recoverable output errors, use Console.Out. Write(string) is bounded to 65536 UTF-8 bytes; existing WriteLine overloads retain their prior behavior.
