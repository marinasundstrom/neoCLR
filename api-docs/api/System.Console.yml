- uid: System.Console.ReadLine
  commentId: M:System.Console.ReadLine
  id: ReadLine
  parent: System.Console
  langs:
  - csharp
  - vb
  name: ReadLine()
  nameWithType: Console.ReadLine()
  fullName: System.Console.ReadLine()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System
  summary: Reads one bounded strict UTF-8 line.
  remarks: The parameterless overload uses 65536. LF and CRLF delimit lines; a lone CR is data. No read-ahead past LF. A limit error consumes input without rollback. Unavailable input maps to IoFailure. See StreamReader.ReadLine.
  example: []
  syntax:
    content: public static Result<Option<string>, TextReadError> ReadLine()
    return:
      type: System.Result{System.Option{System.String},System.IO.TextReadError}
      description: Some text, including empty text for an empty line; None for EOF before any data; or TextReadError.
    content.vb: Public Shared Function ReadLine() As Result(Of [Option](Of String), TextReadError)
  overload: System.Console.ReadLine*
