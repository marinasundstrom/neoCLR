- uid: System.Tasks.TaskQueue.Drain
  commentId: M:System.Tasks.TaskQueue.Drain
  id: Drain
  parent: System.Tasks.TaskQueue
  langs:
  - csharp
  - vb
  name: Drain()
  nameWithType: TaskQueue.Drain()
  fullName: System.Tasks.TaskQueue.Drain()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Tasks
  summary: Runs queued callbacks until the queue is empty.
  remarks: Callbacks posted by a running callback join the next batch. Recursive pumping produces a runtime fault. Runtime faults stop execution; this is not an exception recovery boundary.
  example: []
  syntax:
    content: public void Drain()
    content.vb: Public Sub Drain()
