  namespace: System.Tasks
  summary: A FIFO callback dispatcher within one guest invocation.
  remarks: Post schedules work. Drain runs callbacks in batches until empty, including callbacks posted during dispatch. Recursive pumping produces a runtime fault. This is not a thread pool or general-purpose event loop. Callback methods using Func&lt;System.Void&gt; are described in the [callback guide](/docs/callbacks.html).
