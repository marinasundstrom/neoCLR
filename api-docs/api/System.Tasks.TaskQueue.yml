  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Tasks
  summary: Gets the lazily created queue for the current invocation.
  remarks: Repeated reads within an invocation return the same queue. Normal runtime invocation pumps default-queue work after the entry point returns; isolated workers have their own invocation state.
  example: []
  syntax:
    content: public static TaskQueue Default { get; }
