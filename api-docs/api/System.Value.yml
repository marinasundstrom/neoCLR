  summary: Represents one explicitly erased, exactly typed payload in the interpreter.
  remarks: Temporary storage used by union carriers and native/host boundaries. This is not System.Object or the .NET System.ValueType base class. It has no application-facing constructor or members; pack, type-test and unpack are low-level operations. No null or default payload is supplied. Removal requires migration of existing storage and lifetime contracts.
