- uid: System.Streams.FileOutputStream
  commentId: T:System.Streams.FileOutputStream
  id: FileOutputStream
  parent: System.Streams
  children:
  - System.Streams.FileOutputStream.Close
  - System.Streams.FileOutputStream.CreateNew(System.String)
  - System.Streams.FileOutputStream.Write(System.Byte[],System.Int32,System.Int32)
  langs:
  - csharp
  - vb
  name: FileOutputStream
  nameWithType: FileOutputStream
  fullName: System.Streams.FileOutputStream
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: A blocking, explicitly closed file write stream. Development API, not included in Preview 9. The Flush method is documented in the File streams guide because DocFX cannot render its unit-valued Result.
  remarks: Native resources belong to the invocation. Close promptly; invocation teardown closes remaining files. A retained stream cannot be reused in another invocation. There is no finalizer, automatic disposal, seeking or asynchronous scheduling in this slice.
  example: []
  syntax:
    content: public sealed class FileOutputStream
    content.vb: Public NotInheritable Class FileOutputStream
  seealso:
  - linkType: HRef
    linkId: ../streams.html#flush
    altText: Flush contract and file stream guide
  inheritance:
  - System.Object
- uid: System.Streams.FileOutputStream.CreateNew(System.String)
  commentId: M:System.Streams.FileOutputStream.CreateNew(System.String)
  id: CreateNew(System.String)
  parent: System.Streams.FileOutputStream
  langs:
  - csharp
  - vb
  name: CreateNew(string)
  nameWithType: FileOutputStream.CreateNew(string)
  fullName: System.Streams.FileOutputStream.CreateNew(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Exclusively creates a regular file and opens it for writing.
  remarks: No truncate, overwrite, append or recursive directory creation is implied.
  example: []
  syntax:
    content: public static Result<FileOutputStream, StreamError> CreateNew(string path)
    parameters:
    - id: path
      type: System.String
      description: New host filesystem path; parent directories must already exist.
    return:
      type: System.Result{System.Streams.FileOutputStream,System.Streams.StreamError}
      description: Ok with a new output stream, or an error. An existing entry returns AlreadyExists and is not overwritten.
    content.vb: Public Shared Function CreateNew(path As String) As Result(Of FileOutputStream, StreamError)
  overload: System.Streams.FileOutputStream.CreateNew*
  nameWithType.vb: FileOutputStream.CreateNew(String)
  fullName.vb: System.Streams.FileOutputStream.CreateNew(String)
  name.vb: CreateNew(String)
- uid: System.Streams.FileOutputStream.Write(System.Byte[],System.Int32,System.Int32)
  commentId: M:System.Streams.FileOutputStream.Write(System.Byte[],System.Int32,System.Int32)
  id: Write(System.Byte[],System.Int32,System.Int32)
  parent: System.Streams.FileOutputStream
  langs:
  - csharp
  - vb
  name: Write(byte[], int, int)
  nameWithType: FileOutputStream.Write(byte[], int, int)
  fullName: System.Streams.FileOutputStream.Write(byte[], int, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Attempts one partial write using a caller-owned byte array.
  remarks: Calls block and may write fewer bytes than requested. Loop over the remaining range. Closing does not make a failed write transactional.
  example: []
  syntax:
    content: public Result<int, StreamError> Write(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: Managed byte array. Do not mutate it during the call.
    - id: offset
      type: System.Int32
      description: Zero-based start index.
    - id: count
      type: System.Int32
      description: Maximum bytes to transfer; zero through 65536, within the array range.
    return:
      type: System.Result{System.Int32,System.Streams.StreamError}
      description: Ok with the transferred count, or a typed StreamError. Invalid ranges fail before I/O.
    content.vb: Public Function Write(buffer As Byte(), offset As Integer, count As Integer) As Result(Of Integer, StreamError)
  overload: System.Streams.FileOutputStream.Write*
  nameWithType.vb: FileOutputStream.Write(Byte(), Integer, Integer)
  fullName.vb: System.Streams.FileOutputStream.Write(Byte(), Integer, Integer)
  name.vb: Write(Byte(), Integer, Integer)
- uid: System.Streams.FileOutputStream.Close
  commentId: M:System.Streams.FileOutputStream.Close
  id: Close
  parent: System.Streams.FileOutputStream
  langs:
  - csharp
  - vb
  name: Close()
  nameWithType: FileOutputStream.Close()
  fullName: System.Streams.FileOutputStream.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Streams
  summary: Releases the open file. Repeated calls are harmless.
  remarks: Subsequent operations return Closed. Close is not a flush or durability guarantee and does not report OS close errors. Invocation teardown releases resources after an unhandled runtime fault.
  example: []
  syntax:
    content: public void Close()
    content.vb: Public Sub Close()
  overload: System.Streams.FileOutputStream.Close*
