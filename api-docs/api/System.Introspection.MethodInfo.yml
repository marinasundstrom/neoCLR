  nameWithType: MethodInfo.GetParameters()
  fullName: System.Introspection.MethodInfo.GetParameters()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Gets parameters in declaration order.
  example: []
  syntax:
    content: Sequence<ParameterInfo> GetParameters()
    return:
      type: System.Collections.Sequence{System.Introspection.ParameterInfo}
      description: A fresh sequence containing parameter snapshots. Parameter equality uses retained owner identity and position. A public declaring-member property is not exposed yet.
    content.vb: Function GetParameters() As Sequence(Of ParameterInfo)
