  name: MethodInfo
  nameWithType: MethodInfo
  fullName: System.Introspection.MethodInfo
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Describes a retained method declaration in the loaded program.
  remarks: Development after Preview 9. Object equality uses descriptor kind, closed declaring type and definition index. Repeated wrappers can compare equal; Object hashes agree and ToString returns Name, not a complete signature. This API describes metadata and does not invoke, read or write application members. See the introspection guide for query and identity limitations.
  example: []
  syntax:
    content: 'public interface MethodInfo : MemberInfo'
    content.vb: Public Interface MethodInfo Inherits MemberInfo
  inheritedMembers:
  - System.Introspection.MemberInfo.MetadataToken
  - System.Introspection.MemberInfo.Module
  - System.Introspection.MemberInfo.Name
  - System.Introspection.MemberInfo.DeclaringType
