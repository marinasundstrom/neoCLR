### YamlMime:ManagedReference
items:
- uid: System.Storage.StorageLookup
  commentId: T:System.Storage.StorageLookup
  id: StorageLookup
  parent: System.Storage
  children:
  - System.Storage.StorageLookup.GetDirectory(System.Storage.Path)
  - System.Storage.StorageLookup.GetFile(System.Storage.Path)
  langs:
  - csharp
  - vb
  name: StorageLookup
  nameWithType: StorageLookup
  fullName: System.Storage.StorageLookup
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: A byte provider that can query file and directory addresses without retaining streams.
  remarks: Extends StorageProvider. GetFile and GetDirectory return interface descriptors bound to the queried provider and logical address, or StorageLookupError. Implementations inspect current kind/existence rather than opening content. Success is an observation, not a guarantee of later access. Byte-only providers need not implement this interface.
  example: []
  syntax:
    content: 'public interface StorageLookup : StorageProvider'
    content.vb: Public Interface StorageLookup Inherits StorageProvider
  inheritedMembers:
  - System.Storage.StorageProvider.OpenRead(System.Storage.Path)
  - System.Storage.StorageProvider.CreateNew(System.Storage.Path)
- uid: System.Storage.StorageLookup.GetDirectory(System.Storage.Path)
  commentId: M:System.Storage.StorageLookup.GetDirectory(System.Storage.Path)
  id: GetDirectory(System.Storage.Path)
  parent: System.Storage.StorageLookup
  langs:
  - csharp
  - vb
  name: GetDirectory(Path)
  nameWithType: StorageLookup.GetDirectory(Path)
  fullName: System.Storage.StorageLookup.GetDirectory(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up an existing directory and returns its provider-owned interface.
  remarks: 'Synchronous; may block. Does not create directories or retain an open stream. Success observes current kind, not stable identity or guaranteed later access. Providers define their directory model: the sample memory provider exposes only its root.'
  example: []
  syntax:
    content: Result<Directory, StorageLookupError> GetDirectory(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical directory address interpreted by this provider.
    return:
      type: System.Result{System.Storage.Directory,System.Storage.StorageLookupError}
      description: A Directory retaining its provider context and logical address, or StorageLookupError such as NotFound, WrongKind, AccessDenied, InvalidPath or IoFailure.
    content.vb: Function GetDirectory(path As Path) As Result(Of Directory, StorageLookupError)
  overload: System.Storage.StorageLookup.GetDirectory*
- uid: System.Storage.StorageLookup.GetFile(System.Storage.Path)
  commentId: M:System.Storage.StorageLookup.GetFile(System.Storage.Path)
  id: GetFile(System.Storage.Path)
  parent: System.Storage.StorageLookup
  langs:
  - csharp
  - vb
  name: GetFile(Path)
  nameWithType: StorageLookup.GetFile(Path)
  fullName: System.Storage.StorageLookup.GetFile(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Looks up an existing file and returns its provider-bound descriptor.
  remarks: Must not create the file or retain an open stream. Provider-specific aliases and concurrent changes do not establish stable item identity.
  example: []
  syntax:
    content: Result<File, StorageLookupError> GetFile(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical file address.
    return:
      type: System.Result{System.Storage.File,System.Storage.StorageLookupError}
      description: A File retaining this provider and address, or StorageLookupError such as NotFound, WrongKind, AccessDenied, InvalidPath or IoFailure.
    content.vb: Function GetFile(path As Path) As Result(Of File, StorageLookupError)
  overload: System.Storage.StorageLookup.GetFile*
