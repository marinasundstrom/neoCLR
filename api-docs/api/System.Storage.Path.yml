  name: Parse(string)
  nameWithType: Path.Parse(string)
  fullName: System.Storage.Path.Parse(string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Validates a logical path without performing I/O.
  remarks: Accepts slash-separated names, optional leading slash, standalone / and .; rejects empty input, NUL, backslash, colon, doubled/trailing separators and dot/parent segments. Preserves accepted spelling.
  example: []
  syntax:
    content: public static Result<Path, InvalidPathError> Parse(string text)
    parameters:
    - id: text
      type: System.String
      description: The logical path spelling to validate.
    return:
      type: System.Result{System.Storage.Path,System.Storage.InvalidPathError}
      description: Ok with an immutable Path, or Error with InvalidPathError.
    content.vb: Public Shared Function Parse(text As String) As Result(Of Path, InvalidPathError)
  overload: System.Storage.Path.Parse*
  nameWithType.vb: Path.Parse(String)
  fullName.vb: System.Storage.Path.Parse(String)
  name.vb: Parse(String)
