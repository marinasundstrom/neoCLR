- uid: System.Storage.FileSystem.GetItem(System.Storage.Path)
  commentId: M:System.Storage.FileSystem.GetItem(System.Storage.Path)
  id: GetItem(System.Storage.Path)
  parent: System.Storage.FileSystem
  langs:
  - csharp
  - vb
  name: GetItem(Path)
  nameWithType: FileSystem.GetItem(Path)
  fullName: System.Storage.FileSystem.GetItem(System.Storage.Path)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Resolves a logical address to the StorageItem interface.
  remarks: Synchronous. Follows host metadata semantics, including symbolic links; no sandbox or stable identity is promised. Does not create an entry or retain a content stream.
  example: []
  syntax:
    content: public Result<StorageItem, StorageLookupError> GetItem(Path path)
    parameters:
    - id: path
      type: System.Storage.Path
      description: Validated logical address; absolute logical paths are mapped beneath the configured root.
    return:
      type: System.Result{System.Storage.StorageItem,System.Storage.StorageLookupError}
      description: A provider-owned StorageItem, or StorageLookupError preserving missing, wrong-kind, access and I/O failures.
    content.vb: Public Function GetItem(path As Path) As Result(Of StorageItem, StorageLookupError)
  overload: System.Storage.FileSystem.GetItem*
  implements:
  - System.Storage.StorageProvider.GetItem(System.Storage.Path)
