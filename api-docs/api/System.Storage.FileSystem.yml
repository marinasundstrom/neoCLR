  name: FileSystem
  nameWithType: FileSystem
  fullName: System.Storage.FileSystem
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: A synchronous host-filesystem implementation of StorageProvider.
  remarks: Development after Preview 9. Maps logical paths beneath a configured native root; this is not a symlink-safe sandbox. Returns File and Directory interfaces backed by internal implementation classes. Construction performs no I/O. Relative native roots use the host working directory. Lookup observes current state and does not retain content handles. See the [provider guide](/docs/storage-provider.html).
  example: []
  syntax:
    content: 'public sealed class FileSystem : StorageProvider'
    content.vb: Public NotInheritable Class FileSystem Implements StorageProvider
  inheritance:
  - System.Object
  implements:
  - System.Storage.StorageProvider
  inheritedMembers:
  - System.Object.GetType
  - System.Object.ToString
