items:
- uid: System.IO.SeekableStream
  commentId: T:System.IO.SeekableStream
  id: SeekableStream
  parent: System.IO
  children:
  - System.IO.SeekableStream.GetPosition
  - System.IO.SeekableStream.Seek(System.Int64)
  langs:
  - csharp
  - vb
  name: SeekableStream
  nameWithType: SeekableStream
  fullName: System.IO.SeekableStream
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: An optional capability for repositioning a stream by byte offset.
  remarks: Independent of reading and writing. FileInputStream implements this capability; TextReader does not. Calls are synchronous and return typed errors. No concurrent position operations are promised.
  example: []
  syntax:
    content: public interface SeekableStream
    content.vb: Public Interface SeekableStream
  derivedClasses:
  - System.IO.FileInputStream
- uid: System.IO.SeekableStream.GetPosition
  commentId: M:System.IO.SeekableStream.GetPosition
  id: GetPosition
  parent: System.IO.SeekableStream
  langs:
  - csharp
  - vb
  name: GetPosition()
  nameWithType: SeekableStream.GetPosition()
  fullName: System.IO.SeekableStream.GetPosition()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reports the current absolute byte position.
  remarks: Closed streams return Closed. Positions outside the representable range return LimitExceeded. This is not a decoded-character position.
  example: []
  syntax:
    content: Result<long, StreamError> GetPosition()
    return:
      type: System.Result{System.Int64,System.IO.StreamError}
      description: The nonnegative position as Int64, or StreamError.
    content.vb: Function GetPosition() As Result(Of Long, StreamError)
  overload: System.IO.SeekableStream.GetPosition*
- uid: System.IO.SeekableStream.Seek(System.Int64)
  commentId: M:System.IO.SeekableStream.Seek(System.Int64)
  id: Seek(System.Int64)
  parent: System.IO.SeekableStream
  langs:
  - csharp
  - vb
  name: Seek(long)
  nameWithType: SeekableStream.Seek(long)
  fullName: System.IO.SeekableStream.Seek(long)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Sets the absolute byte position without changing file contents.
  remarks: Closed is checked first. Negative positions return InvalidRange without moving the cursor. Reading beyond EOF returns zero. Seeking does not reset a separate text reader's state; close a leave-open reader before independently repositioning and constructing a new reader.
  example: []
  syntax:
    content: Result<long, StreamError> Seek(long position)
    parameters:
    - id: position
      type: System.Int64
      description: Nonnegative absolute byte offset. FileInputStream permits positions beyond EOF.
    return:
      type: System.Result{System.Int64,System.IO.StreamError}
      description: The resulting position or StreamError.
    content.vb: Function Seek(position As Long) As Result(Of Long, StreamError)
  overload: System.IO.SeekableStream.Seek*
  nameWithType.vb: SeekableStream.Seek(Long)
  fullName.vb: System.IO.SeekableStream.Seek(Long)
  name.vb: Seek(Long)
