  name: StreamReader
  nameWithType: StreamReader
  fullName: System.IO.StreamReader
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: A synchronous strict UTF-8 TextReader over InputStream.
  remarks: Preserves a UTF-8 BOM as text. Reads from the current byte position and buffers remaining input until EOF; not constant-memory decoding. Supports partial reads and split UTF-8 characters. See the [reader guide](/docs/streams.html#text-readers). Close owns the input unless leaveOpen was selected. The reader has no seek API.
  example: []
  syntax:
    content: 'public sealed class StreamReader : TextReader'
    content.vb: Public NotInheritable Class StreamReader Implements TextReader
  inheritance:
  - System.Object
  implements:
  - System.IO.TextReader
  inheritedMembers:
  - System.Object.GetType
  - System.Object.ToString
