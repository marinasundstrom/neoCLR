- uid: System.IO.StreamReader.ReadLine(System.Int32)
  commentId: M:System.IO.StreamReader.ReadLine(System.Int32)
  id: ReadLine(System.Int32)
  parent: System.IO.StreamReader
  langs:
  - csharp
  - vb
  name: ReadLine(int)
  nameWithType: StreamReader.ReadLine(int)
  fullName: System.IO.StreamReader.ReadLine(int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reads one strict UTF-8 line without its LF or CRLF terminator.
  remarks: StreamReader performs one-byte reads to avoid read-ahead. A lone CR is data. A BOM is preserved. An unterminated final line is returned once. Invalid bounds consume nothing; decoding, I/O and length errors may advance input. Close is checked first. No rollback or asynchronous behavior is promised.
  example: []
  syntax:
    content: public Result<Option<string>, TextReadError> ReadLine(int maxUtf8Bytes)
    parameters:
    - id: maxUtf8Bytes
      type: System.Int32
      description: Maximum content bytes, 0 through 65536 for StreamReader.
    return:
      type: System.Result{System.Option{System.String},System.IO.TextReadError}
      description: Some text for a line; None for EOF before any data; or TextReadError.
    content.vb: Public Function ReadLine(maxUtf8Bytes As Integer) As Result(Of [Option](Of String), TextReadError)
  overload: System.IO.StreamReader.ReadLine*
  implements:
  - System.IO.TextReader.ReadLine(System.Int32)
  nameWithType.vb: StreamReader.ReadLine(Integer)
  fullName.vb: System.IO.StreamReader.ReadLine(Integer)
  name.vb: ReadLine(Integer)
- uid: System.IO.StreamReader.ReadToEnd(System.Int32)
  commentId: M:System.IO.StreamReader.ReadToEnd(System.Int32)
  id: ReadToEnd(System.Int32)
  parent: System.IO.StreamReader
  langs:
  - csharp
  - vb
  name: ReadToEnd(int)
  nameWithType: StreamReader.ReadToEnd(int)
  fullName: System.IO.StreamReader.ReadToEnd(int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reads remaining text subject to a UTF-8 output-byte bound.
  remarks: StreamReader checks Closed before bounds and reads no input for invalid bounds. It consumes at most one byte beyond the bound to distinguish exact-bound EOF. Errors can leave input advanced; there is no rollback. Decoding is strict and preserves a BOM. Repeated reading at EOF returns empty text. Host execution and allocation budgets still apply.
  example: []
  syntax:
    content: public Result<string, TextReadError> ReadToEnd(int maxUtf8Bytes)
    parameters:
    - id: maxUtf8Bytes
      type: System.Int32
      description: Nonnegative maximum UTF-8 bytes in the returned text. StreamReader accepts up to 65536; zero succeeds only at EOF.
    return:
      type: System.Result{System.String,System.IO.TextReadError}
      description: The remaining text, or TextReadError.
    content.vb: Public Function ReadToEnd(maxUtf8Bytes As Integer) As Result(Of String, TextReadError)
  overload: System.IO.StreamReader.ReadToEnd*
  implements:
  - System.IO.TextReader.ReadToEnd(System.Int32)
  nameWithType.vb: StreamReader.ReadToEnd(Integer)
  fullName.vb: System.IO.StreamReader.ReadToEnd(Integer)
  name.vb: ReadToEnd(Integer)
