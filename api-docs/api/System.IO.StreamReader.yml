  name: Close()
  nameWithType: StreamReader.Close()
  fullName: System.IO.StreamReader.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Closes the reader idempotently.
  remarks: Later reads return Closed. StreamReader closes owned input, or leaves it open if requested. Does not rewind or report underlying close errors.
  example: []
  syntax:
    content: public void Close()
    content.vb: Public Sub Close()
  overload: System.IO.StreamReader.Close*
  implements:
  - System.IO.TextReader.Close
