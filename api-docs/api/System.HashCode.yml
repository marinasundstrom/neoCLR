  namespace: System
  summary: A mutable value accumulator for combining integer and string components into an execution-local hash.
  remarks: Development API. Copies have independent state. This bounded implementation has no generic Add or comparer overloads, no randomized seed, and no persistent or cryptographic guarantee. It does not reproduce .NET hash values. Equal component sequences produce equal hashes; collisions are possible.
