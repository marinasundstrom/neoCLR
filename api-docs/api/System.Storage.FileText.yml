  namespace: System.Storage
  summary: Compatibility helpers for bounded native UTF-8 file reads and writes.
  remarks: Development callers migrate File.ReadAllText/WriteAllText to FileText.ReadAllText/WriteAllText as File becomes an interface. Native string resolution and error behavior are unchanged; these helpers do not use StorageProvider. WriteAllText is documented in the [manual reference](/docs/storage-items.html#writealltext) because DocFX cannot render its unit-valued result.
