- uid: System.Storage.FileText.ReadAllText(System.String,System.Int32)
  commentId: M:System.Storage.FileText.ReadAllText(System.String,System.Int32)
  id: ReadAllText(System.String,System.Int32)
  parent: System.Storage.FileText
  langs:
  - csharp
  - vb
  name: ReadAllText(string, int)
  nameWithType: FileText.ReadAllText(string, int)
  fullName: System.Storage.FileText.ReadAllText(string, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Reads a bounded native file as strict UTF-8.
  remarks: Synchronous. Opens and closes per call. Rejects non-regular files, malformed UTF-8 and contents exceeding the limit; a UTF-8 BOM is preserved as text. Zero accepts an empty file. This static helper does not use a descriptor provider.
  example: []
  syntax:
    content: public static Result<string, FileReadError> ReadAllText(string path, int maxBytes)
    parameters:
    - id: path
      type: System.String
      description: Native path string; provider Path parsing is not applied.
    - id: maxBytes
      type: System.Int32
      description: Nonnegative maximum number of bytes to read.
    return:
      type: System.Result{System.String,System.Storage.FileReadError}
      description: The decoded text, or FileReadError.
    content.vb: Public Shared Function ReadAllText(path As String, maxBytes As Integer) As Result(Of String, FileReadError)
