  namespace: System.IO
  summary: A sequential text-reading contract independent of its backing source.
  remarks: 'Development POC: bounded whole-text reading and explicit Close. Does not require byte streams or seekability. No async or line-reading members are implemented.'
  example: []
  syntax:
    content: public interface TextReader
    content.vb: Public Interface TextReader
  derivedClasses:
