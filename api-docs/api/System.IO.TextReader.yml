  namespace: System.IO
  summary: A sequential text-reading contract independent of its backing source.
  remarks: 'Development API: bounded line and whole-text reading with explicit Close. Does not require byte streams or seekability. Synchronous; no async members are implemented.'
  example: []
  syntax:
    content: public interface TextReader
    content.vb: Public Interface TextReader
  derivedClasses:
  - System.IO.StreamReader
- uid: System.IO.TextReader.ReadLine(System.Int32)
  commentId: M:System.IO.TextReader.ReadLine(System.Int32)
  id: ReadLine(System.Int32)
  parent: System.IO.TextReader
  langs:
  - csharp
  - vb
  name: ReadLine(int)
  nameWithType: TextReader.ReadLine(int)
  fullName: System.IO.TextReader.ReadLine(int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reads one strict UTF-8 line without its LF or CRLF terminator.
  remarks: StreamReader performs one-byte reads to avoid read-ahead. A lone CR is data. A BOM is preserved. An unterminated final line is returned once. Invalid bounds consume nothing; decoding, I/O and length errors may advance input. Close is checked first. No rollback or asynchronous behavior is promised.
  example: []
  syntax:
    content: Result<Option<string>, TextReadError> ReadLine(int maxUtf8Bytes)
    parameters:
    - id: maxUtf8Bytes
      type: System.Int32
      description: Maximum content bytes, 0 through 65536 for StreamReader.
    return:
      type: System.Result{System.Option{System.String},System.IO.TextReadError}
      description: Some text for a line; None for EOF before any data; or TextReadError.
    content.vb: Function ReadLine(maxUtf8Bytes As Integer) As Result(Of [Option](Of String), TextReadError)
  overload: System.IO.TextReader.ReadLine*
  nameWithType.vb: TextReader.ReadLine(Integer)
  fullName.vb: System.IO.TextReader.ReadLine(Integer)
  name.vb: ReadLine(Integer)
- uid: System.IO.TextReader.ReadToEnd(System.Int32)
  commentId: M:System.IO.TextReader.ReadToEnd(System.Int32)
  id: ReadToEnd(System.Int32)
  parent: System.IO.TextReader
  langs:
  - csharp
  - vb
  name: ReadToEnd(int)
  nameWithType: TextReader.ReadToEnd(int)
  fullName: System.IO.TextReader.ReadToEnd(int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Reads remaining text subject to a UTF-8 output-byte bound.
  remarks: StreamReader checks Closed before bounds and reads no input for invalid bounds. It consumes at most one byte beyond the bound to distinguish exact-bound EOF. Errors can leave input advanced; there is no rollback. Decoding is strict and preserves a BOM. Repeated reading at EOF returns empty text. Host execution and allocation budgets still apply.
  example: []
  syntax:
    content: Result<string, TextReadError> ReadToEnd(int maxUtf8Bytes)
    parameters:
    - id: maxUtf8Bytes
      type: System.Int32
      description: Nonnegative maximum UTF-8 bytes in the returned text. StreamReader accepts up to 65536; zero succeeds only at EOF.
    return:
      type: System.Result{System.String,System.IO.TextReadError}
      description: The remaining text, or TextReadError.
    content.vb: Function ReadToEnd(maxUtf8Bytes As Integer) As Result(Of String, TextReadError)
  overload: System.IO.TextReader.ReadToEnd*
  nameWithType.vb: TextReader.ReadToEnd(Integer)
  fullName.vb: System.IO.TextReader.ReadToEnd(Integer)
  name.vb: ReadToEnd(Integer)
- uid: System.IO.TextReader.Close
  commentId: M:System.IO.TextReader.Close
  id: Close
  parent: System.IO.TextReader
  langs:
  - csharp
  - vb
  name: Close()
  nameWithType: TextReader.Close()
  fullName: System.IO.TextReader.Close()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: Closes the reader idempotently.
  remarks: Later reads return Closed. StreamReader closes owned input, or leaves it open if requested. Does not rewind or report underlying close errors.
  example: []
  syntax:
    content: void Close()
    content.vb: Sub Close()
  overload: System.IO.TextReader.Close*
