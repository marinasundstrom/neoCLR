- uid: System.Introspection.TypeInfo.Equals(System.Introspection.TypeInfo)
  commentId: M:System.Introspection.TypeInfo.Equals(System.Introspection.TypeInfo)
  id: Equals(System.Introspection.TypeInfo)
  parent: System.Introspection.TypeInfo
  langs:
  - csharp
  - vb
  name: Equals(TypeInfo)
  nameWithType: TypeInfo.Equals(TypeInfo)
  fullName: System.Introspection.TypeInfo.Equals(System.Introspection.TypeInfo)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Compares represented type identity with another TypeInfo.
  remarks: Object.Equals(Object?) is a separate null-aware overload on the runtime implementation. Names and metadata tokens alone do not establish identity.
  example: []
  syntax:
    content: bool Equals(TypeInfo other)
    parameters:
    - id: other
      type: System.Introspection.TypeInfo
      description: The non-null descriptor to compare; the typed contract takes TypeInfo, not TypeInfo?.
    return:
      type: System.Boolean
      description: True for the same represented type, including the same generic arguments and element shape.
    content.vb: Function Equals(other As TypeInfo) As Boolean
  overload: System.Introspection.TypeInfo.Equals*
