  name: TypeInfo
  nameWithType: TypeInfo
  fullName: System.Introspection.TypeInfo
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Describes a represented type within the current loaded program.
  remarks: Development RuntimeTypeInfo implementations compare represented identity through typed and Object equality; reference identity still distinguishes wrapper allocations. See the introspection guide for hash/display behavior and remaining descriptor contracts.
  example: []
  syntax:
    content: 'public interface TypeInfo : MemberInfo'
    content.vb: Public Interface TypeInfo Inherits MemberInfo
