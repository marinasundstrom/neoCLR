  name: ModuleInfo
  nameWithType: ModuleInfo
  fullName: System.Introspection.ModuleInfo
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Describes a retained, loaded module in the current program.
  remarks: Development after Preview 9. Object equality compares full assembly identity and module name; hashes use the same components. Separate wrappers can compare equal. Null and other descriptor kinds compare false. No dynamic loading or cross-program identity is supported. See the introspection guide for Object display and identity limitations.
  example: []
  syntax:
    content: public interface ModuleInfo
    content.vb: Public Interface ModuleInfo
- uid: System.Introspection.ModuleInfo.GetTypes
  commentId: M:System.Introspection.ModuleInfo.GetTypes
  id: GetTypes
  parent: System.Introspection.ModuleInfo
  langs:
