  - vb
  name: GetTypes()
  nameWithType: ModuleInfo.GetTypes()
  fullName: System.Introspection.ModuleInfo.GetTypes()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Introspection
  summary: Gets retained type definitions, including nonpublic and open generic definitions.
  example: []
  syntax:
    content: Sequence<TypeInfo> GetTypes()
    return:
      type: System.Collections.Sequence{System.Introspection.TypeInfo}
      description: A snapshot sequence of descriptors in the loaded catalog, not an inventory read from disk. Importer-discarded metadata is not restored.
    content.vb: Function GetTypes() As Sequence(Of TypeInfo)
  overload: System.Introspection.ModuleInfo.GetTypes*
