  name: Queue(Func<string, string>, string)
  nameWithType: ThreadPool.Queue(Func<string, string>, string)
  fullName: System.Concurrency.ThreadPool.Queue(System.Func<string, string>, string)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Concurrency
  summary: Submits an uncaptured string-to-string callback to the invocation worker pool.
  remarks: Input and result are copied strings. Completion uses the active or default TaskQueue. This restricted worker API does not define the future general Task.Run contract.
  example: []
  syntax:
    content: public static Task<string> Queue(Func<string, string> callback, string input)
    parameters:
    - id: callback
      type: System.Func{System.String,System.String}
      description: A static function with no captured receiver, taking copied input text and returning result text.
    - id: input
      type: System.String
      description: Text copied into the isolated worker invocation.
    return:
      type: System.Tasks.Task{System.String}
      description: A task for the copied result text, completed on the selected dispatcher.
    content.vb: Public Shared Function Queue(callback As Func(Of String, String), input As String) As Task(Of String)
