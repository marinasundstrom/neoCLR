- uid: System.Storage.File.Name
  commentId: P:System.Storage.File.Name
  id: Name
  parent: System.Storage.File
  langs:
  - csharp
  - vb
  name: Name
  nameWithType: File.Name
  fullName: System.Storage.File.Name
  type: Property
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Gets the final component of the current logical path.
  remarks: No metadata query occurs. The current grammar excludes native drive/UNC paths; revisit extraction with future Path formats.
  example: []
  syntax:
    content: public string Name { get; }
    parameters: []
    return:
      type: System.String
      description: The native GetFileName result for the accepted slash-based spelling; an empty string for root.
    content.vb: Public ReadOnly Property Name As String
  overload: System.Storage.File.Name*
