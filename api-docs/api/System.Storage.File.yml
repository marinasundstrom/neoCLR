  name: File
  nameWithType: File
  fullName: System.Storage.File
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: A provider-bound file address with byte-stream access and compatible static native text helpers.
  remarks: Development instance API after Preview 9. Construction performs no lookup or I/O. A descriptor owns no stream and does not guarantee existence or stable file identity. Name is derived from Path. Static text helpers use native string paths independently of the descriptor provider. See the [descriptor guide](/docs/storage-items.html).
  example: []
  syntax:
    content: public sealed class File
    content.vb: Public NotInheritable Class File
  inheritance:
  - System.Object
