  nameWithType: File.File(StorageProvider, Path)
  fullName: System.Storage.File.File(System.Storage.StorageProvider, System.Storage.Path)
  type: Constructor
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Retains a byte provider and validated logical address.
  remarks: The file need not exist. Construction does not create it or open a handle.
  example: []
  syntax:
    content: public File(StorageProvider provider, Path path)
    parameters:
    - id: provider
      type: System.Storage.StorageProvider
      description: Provider used for subsequent byte opening operations.
    - id: path
      type: System.Storage.Path
      description: Address interpreted in that provider namespace.
    content.vb: Public Sub New(provider As StorageProvider, path As Path)
