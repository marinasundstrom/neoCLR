  commentId: M:System.Storage.File.CreateNew
  id: CreateNew
  parent: System.Storage.File
  langs:
  - csharp
  - vb
  name: CreateNew()
  nameWithType: File.CreateNew()
  fullName: System.Storage.File.CreateNew()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Exclusively creates an empty file for writing.
  remarks: Delegates to the provider with Path. The caller closes a successful stream. Opening can fail even after successful lookup. Creation never overwrites an existing entry; later write failure does not roll back creation.
  example: []
  syntax:
    content: public Result<OutputStream, StreamError> CreateNew()
    return:
      type: System.Result{System.Streams.OutputStream,System.Streams.StreamError}
      description: OutputStream on success, or the retained provider's StreamError unchanged.
    content.vb: Public Function CreateNew() As Result(Of OutputStream, StreamError)
  overload: System.Storage.File.CreateNew*
- uid: System.Storage.File.ReadAllText(System.String,System.Int32)
  commentId: M:System.Storage.File.ReadAllText(System.String,System.Int32)
  id: ReadAllText(System.String,System.Int32)
  parent: System.Storage.File
  langs:
  - csharp
  - vb
  name: ReadAllText(string, int)
  nameWithType: File.ReadAllText(string, int)
  fullName: System.Storage.File.ReadAllText(string, int)
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Reads a bounded native file as strict UTF-8.
  remarks: Synchronous. Opens and closes per call. Rejects non-regular files, malformed UTF-8 and contents exceeding the limit; a UTF-8 BOM is preserved as text. Zero accepts an empty file. This static helper does not use a descriptor provider.
  example: []
  syntax:
    content: public static Result<string, FileReadError> ReadAllText(string path, int maxBytes)
    parameters:
    - id: path
      type: System.String
      description: Native path string; provider Path parsing is not applied.
    - id: maxBytes
      type: System.Int32
      description: Nonnegative maximum number of bytes to read.
    return:
      type: System.Result{System.String,System.Storage.FileReadError}
      description: The decoded text, or FileReadError.
    content.vb: Public Shared Function ReadAllText(path As String, maxBytes As Integer) As Result(Of String, FileReadError)
  overload: System.Storage.File.ReadAllText*
  nameWithType.vb: File.ReadAllText(String, Integer)
  fullName.vb: System.Storage.File.ReadAllText(String, Integer)
  name.vb: ReadAllText(String, Integer)
