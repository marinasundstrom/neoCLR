### YamlMime:ManagedReference
items:
- uid: System.Storage.File
  commentId: T:System.Storage.File
  id: File
  parent: System.Storage
  children:
  - System.Storage.File.CreateNew
  - System.Storage.File.OpenRead
  langs:
  - csharp
  - vb
  name: File
  nameWithType: File
  fullName: System.Storage.File
  type: Interface
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: The file branch of StorageItem, implemented by storage providers.
  remarks: Development interface after Preview 9. Implementations supply Name, Path and byte operations. File has no public constructor and owns no mandatory native handle. Current operations block and return directional streams; callers close successful streams. CreateNew remains a POC address-opening operation pending alignment of creation with resolved items. Static native text helpers moved to FileText. See the [Storage guide](/docs/storage-items.html).
  example: []
  syntax:
    content: 'public interface File : StorageItem'
    content.vb: Public Interface File Inherits StorageItem
  inheritedMembers:
  - System.Storage.StorageItem.Path
  - System.Storage.StorageItem.Name
- uid: System.Storage.File.OpenRead
  commentId: M:System.Storage.File.OpenRead
  id: OpenRead
  parent: System.Storage.File
  langs:
  - csharp
  - vb
  name: OpenRead()
  nameWithType: File.OpenRead()
  fullName: System.Storage.File.OpenRead()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Opens existing bytes for reading.
  remarks: Delegates to the provider with Path. The caller closes a successful stream. Opening can fail even after successful lookup. Creation never overwrites an existing entry; later write failure does not roll back creation.
  example: []
  syntax:
    content: Result<InputStream, StreamError> OpenRead()
    return:
      type: System.Result{System.Streams.InputStream,System.Streams.StreamError}
      description: InputStream on success, or the retained provider's StreamError unchanged.
    content.vb: Function OpenRead() As Result(Of InputStream, StreamError)
  overload: System.Storage.File.OpenRead*
- uid: System.Storage.File.CreateNew
  commentId: M:System.Storage.File.CreateNew
  id: CreateNew
  parent: System.Storage.File
  langs:
  - csharp
  - vb
  name: CreateNew()
  nameWithType: File.CreateNew()
  fullName: System.Storage.File.CreateNew()
  type: Method
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.Storage
  summary: Exclusively creates an empty file for writing.
  remarks: Delegates to the provider with Path. The caller closes a successful stream. Opening can fail even after successful lookup. Creation never overwrites an existing entry; later write failure does not roll back creation.
  example: []
  syntax:
    content: Result<OutputStream, StreamError> CreateNew()
    return:
      type: System.Result{System.Streams.OutputStream,System.Streams.StreamError}
      description: OutputStream on success, or the retained provider's StreamError unchanged.
    content.vb: Function CreateNew() As Result(Of OutputStream, StreamError)
  overload: System.Storage.File.CreateNew*
