  namespace: System.IO
  summary: Writes text.
  remarks: StreamWriter accepts at most 65536 encoded bytes per call, including the line terminator. Closed and oversized writes produce errors before output. Failed writes may have partially written data.
  example: []
  syntax:
    content: public Result<int, StreamError> Write(string text)
    parameters:
    - id: text
      type: System.String
      description: Text to encode as UTF-8.
    return:
      type: System.Result{System.Int32,System.IO.StreamError}
      description: Number of bytes written, including LF for WriteLine, or StreamError.
    content.vb: Public Function Write(text As String) As Result(Of Integer, StreamError)
