  name: StreamWriter
  nameWithType: StreamWriter
  fullName: System.IO.StreamWriter
  type: Class
  assemblies:
  - NeoCLR.CoreProbe
  namespace: System.IO
  summary: An unbuffered UTF-8 TextWriter over OutputStream.
  remarks: Writes no BOM and uses LF for WriteLine. Retries partial writes; a zero-progress write becomes IoFailure. No concurrent-write serialization is provided. Errors can follow partial output. Explicit Flush reports errors; Close releases owned output without an implicit flush.
  example: []
  syntax:
    content: 'public sealed class StreamWriter : TextWriter'
    content.vb: Public NotInheritable Class StreamWriter Implements TextWriter
