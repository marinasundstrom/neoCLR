name: Windows native host prerequisites
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/native/windows-host-memory*'
      - 'scripts/validate-windows-host.py'
      - '.github/workflows/windows-native-host.yml'
  pull_request:
    paths:
      - 'tools/native/windows-host-memory*'
      - 'scripts/validate-windows-host.py'
      - '.github/workflows/windows-native-host.yml'
permissions:
  contents: read
jobs:
  guarded-heap:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and exercise guarded heap ownership
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-windows-host.py --output target/windows-host-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/windows-host-validation/
          retention-days: 14
          if-no-files-found: warn
