name: Native network parity
on:
  workflow_dispatch:
    inputs:
      benchmark_rooted_pacing:
        description: Qualify the closed rooted-admission pacing experiment
        type: boolean
        default: false
      benchmark_gc_allocation:
        description: Run matched allocation traversal benchmarks
        type: boolean
        default: false
      benchmark_gc_index:
        description: Run matched GC graph benchmarks after contract checks
        type: boolean
        default: false
  push:
    paths:
      - 'docs/experiments/aot-console/socket-*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'docs/experiments/aot-console/root-probe*'
      - 'docs/experiments/aot-console/text-arena*'
      - 'docs/experiments/aot-fault-details/fault-details.h'
      - 'scripts/validate-native-network.py'
      - 'scripts/validate-native-gc.py'
      - 'docs/experiments/aot-console/root-validation-test.c'
      - '.github/workflows/native-network.yml'
  pull_request:
    paths:
      - 'docs/experiments/aot-console/socket-*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'docs/experiments/aot-console/root-probe*'
      - 'docs/experiments/aot-console/text-arena*'
      - 'docs/experiments/aot-fault-details/fault-details.h'
      - 'scripts/validate-native-network.py'
      - 'scripts/validate-native-gc.py'
      - 'docs/experiments/aot-console/root-validation-test.c'
      - '.github/workflows/native-network.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run macOS socket contracts
        if: runner.os == 'macOS'
        run: python3 scripts/validate-native-network.py --output target/native-network-validation
      - name: Run Windows socket contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-network.py --output target/native-network-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows GC and root contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-gc.py --output target/native-gc-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark macOS GC graph lookup
        if: runner.os == 'macOS' && inputs.benchmark_gc_index
        run: python3 benchmarks/gc-index/benchmark.py --baseline 924b45110 --output target/gc-index-benchmark
      - name: Benchmark Windows GC graph lookup
        if: runner.os == 'Windows' && inputs.benchmark_gc_index
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python benchmarks/gc-index/benchmark.py --baseline 924b45110 --output target/gc-index-benchmark"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark macOS GC allocation
        if: runner.os == 'macOS' && inputs.benchmark_gc_allocation
        run: python3 benchmarks/gc-allocation/benchmark.py --baseline 13edfa189 --output target/gc-allocation-benchmark
      - name: Benchmark Windows GC allocation
        if: runner.os == 'Windows' && inputs.benchmark_gc_allocation
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python benchmarks/gc-allocation/benchmark.py --baseline 13edfa189 --output target/gc-allocation-benchmark"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evaluate macOS rooted pacing
        if: runner.os == 'macOS' && inputs.benchmark_rooted_pacing
        run: python3 benchmarks/http-gc-pacing/evaluate-rooted.py --output target/rooted-pacing
      - name: Evaluate Windows rooted pacing
        if: runner.os == 'Windows' && inputs.benchmark_rooted_pacing
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python benchmarks/http-gc-pacing/evaluate-rooted.py --output target/rooted-pacing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-network-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/native-network-validation/
            target/native-gc-validation/
            target/gc-index-benchmark/
            target/gc-allocation-benchmark/
            target/rooted-pacing/
          retention-days: 14
          if-no-files-found: warn
