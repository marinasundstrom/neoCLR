name: Windows JIT HTTP
on:
  workflow_dispatch:
    inputs:
      benchmark_roots:
        description: Run matched JIT/AOT HTTP root-observation benchmarks
        type: boolean
        default: false
      http_focus:
        description: Qualify HTTP and SSL streams without unrelated library suites
        type: boolean
        default: false
  push:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tools/aot-poc/**'
      - 'tools/native-crypto/**'
      - 'tools/security-provider/**'
      - 'docs/experiments/native-cryptography/**'
      - 'docs/experiments/jit-*/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'runtime/raven/**'
      - 'scripts/prepare-jit-bundle.py'
      - 'tools/native-tls/**'
      - 'docs/experiments/shared-tls/**'
      - 'docs/experiments/aot-console/tls-managed*'
      - 'scripts/prepare-native-development-bundle.py'
      - 'scripts/prepare-native-bootstrap.py'
      - 'scripts/build-native-class-library.py'
      - 'scripts/build-native-project.py'
      - 'scripts/test-runtime-library.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-jit.yml'
      - 'scripts/validate-native-http-project.py'
      - 'scripts/verify-native-http-json.py'
      - 'benchmarks/native-web/http-host.c'
      - 'docs/experiments/http-server/Server.rvn'
      - 'docs/experiments/runtime-async/RuntimeUse.rvn'
      - 'docs/experiments/runtime-async/RuntimeGenericUse.rvn'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tools/aot-poc/**'
      - 'tools/native-crypto/**'
      - 'tools/security-provider/**'
      - 'docs/experiments/native-cryptography/**'
      - 'docs/experiments/jit-*/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'runtime/raven/**'
      - 'scripts/prepare-jit-bundle.py'
      - 'tools/native-tls/**'
      - 'docs/experiments/shared-tls/**'
      - 'docs/experiments/aot-console/tls-managed*'
      - 'scripts/prepare-native-development-bundle.py'
      - 'scripts/prepare-native-bootstrap.py'
      - 'scripts/build-native-class-library.py'
      - 'scripts/build-native-project.py'
      - 'scripts/test-runtime-library.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-jit.yml'
      - 'scripts/validate-native-http-project.py'
      - 'scripts/verify-native-http-json.py'
      - 'benchmarks/native-web/http-host.c'
      - 'docs/experiments/http-server/Server.rvn'
      - 'docs/experiments/runtime-async/RuntimeUse.rvn'
      - 'docs/experiments/runtime-async/RuntimeGenericUse.rvn'
permissions:
  contents: read
jobs:
  http-project:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      HTTP_FOCUS: ${{ inputs.http_focus }}
      BENCHMARK_ROOTS: ${{ inputs.benchmark_roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check benchmark controller and process cleanup
        if: inputs.benchmark_roots
        run: |
          python -m unittest discover -s benchmarks/http-server -p test_windows_root_observation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s benchmarks/framework -p test_process.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select OpenSSL for disposable TLS fixtures
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' >> $env:GITHUB_PATH
      - name: Build and qualify Windows JIT HTTP
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          if ($env:HTTP_FOCUS -eq 'true' -and $env:BENCHMARK_ROOTS -eq 'true') { throw 'Choose one scope' }
          $focus = if ($env:HTTP_FOCUS -eq 'true') { '--http-focus' } elseif ($env:BENCHMARK_ROOTS -eq 'true') { '--benchmark-roots' } else { '' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python docs/experiments/jit-windows/verify.py --output target/windows-jit-validation $focus"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-jit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/windows-jit-validation/*.json
            target/windows-jit-validation/*.log
            target/windows-jit-validation/http/
            target/windows-jit-validation/http-benchmark/results.json
            target/windows-jit-validation/http-benchmark/*-native/build.json
            target/windows-jit-validation/framework/
            target/windows-jit-validation/cryptography/
            target/windows-jit-validation/cryptography-project/
            target/windows-jit-validation/tls-ownership/validation.json
            target/windows-jit-validation/tls-project/validation.json
            target/windows-jit-validation/tls-project/native/build.json
            target/windows-jit-validation/tls-streams/validation.json
            target/windows-jit-validation/tls-streams/native/build.json
            target/windows-jit-validation/tls-http-failures/validation.json
            target/windows-jit-validation/tls-http-failures/native/build.json
            target/windows-jit-validation/tls-http-interop/validation.json
            target/windows-jit-validation/tls-http-interop/native/build.json
            target/windows-jit-validation/public-cryptography/
            target/windows-jit-validation/native/build.json
            target/windows-jit-validation/async-use/
            target/windows-jit-validation/generic-async-use/
            target/windows-jit-validation/jit-install/preparation.json
            target/windows-jit-validation/jit-install/bundle/manifest.json
            target/windows-jit-validation/development/**/*.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
