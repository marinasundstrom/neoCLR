name: Native type tokens
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/experiments/aot-console/type-tokens*'
      - 'docs/experiments/aot-console/type-descriptors*'
      - 'docs/experiments/aot-console/primitive-boxes*'
      - 'docs/experiments/aot-console/object-types*'
      - 'docs/experiments/aot-console/reflection-construction*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'docs/experiments/aot-console/root-probe*'
      - 'tools/native/windows-native-stack.c'
      - 'tools/aot-poc/**'
      - 'scripts/validate-native-type-tokens.py'
      - '.github/workflows/native-type-tokens.yml'
  pull_request:
    paths:
      - 'docs/experiments/aot-console/type-tokens*'
      - 'docs/experiments/aot-console/type-descriptors*'
      - 'docs/experiments/aot-console/primitive-boxes*'
      - 'docs/experiments/aot-console/object-types*'
      - 'docs/experiments/aot-console/reflection-construction*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'docs/experiments/aot-console/root-probe*'
      - 'tools/native/windows-native-stack.c'
      - 'tools/aot-poc/**'
      - 'scripts/validate-native-type-tokens.py'
      - '.github/workflows/native-type-tokens.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --manifest-path tools/aot-poc/Cargo.toml
      - name: Run macOS type token contracts
        if: runner.os == 'macOS'
        run: |
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-type-tokens-validation
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-type-equality-validation --runtime-equality
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-type-descriptors-validation --descriptor-queries
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-primitive-boxes-validation --primitive-boxes
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-object-types-validation --object-types
          python3 scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-reflection-construction-validation --reflection-construction
      - name: Run Windows type token contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-type-tokens-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-type-equality-validation --runtime-equality"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-type-descriptors-validation --descriptor-queries"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-primitive-boxes-validation --primitive-boxes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-object-types-validation --object-types"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-type-tokens.py --aot tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-reflection-construction-validation --reflection-construction"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-type-tokens-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/native-type-tokens-validation/
            target/native-type-equality-validation/
            target/native-type-descriptors-validation/
            target/native-primitive-boxes-validation/
            target/native-object-types-validation/
            target/native-reflection-construction-validation/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
