name: Windows native HTTP project
on:
  workflow_dispatch:
    inputs:
      reuse_bundle_run:
        description: Prior successful toolchain artifact run for SDK-only qualification with a rebuilt backend
        type: string
        default: ""
      runtime_await:
        description: Qualify SDK-default runtime await in interpreter, installed JIT and AOT
        type: boolean
        default: false
      paced_gc:
        description: Compare stress/paced managed HTTP and retain GC diagnostics
        type: boolean
        default: false
  push:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tools/aot-poc/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'runtime/raven/**'
      - 'scripts/prepare-native-development-bundle.py'
      - 'scripts/prepare-native-bootstrap.py'
      - 'scripts/build-native-class-library.py'
      - 'scripts/build-native-project.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-native-http-project.yml'
      - 'scripts/validate-native-http-project.py'
      - 'scripts/verify-native-http-json.py'
      - 'benchmarks/native-web/http-host.c'
      - 'docs/experiments/http-server/Server.rvn'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tools/aot-poc/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'runtime/raven/**'
      - 'scripts/prepare-native-development-bundle.py'
      - 'scripts/prepare-native-bootstrap.py'
      - 'scripts/build-native-class-library.py'
      - 'scripts/build-native-project.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-native-http-project.yml'
      - 'scripts/validate-native-http-project.py'
      - 'scripts/verify-native-http-json.py'
      - 'benchmarks/native-web/http-host.c'
      - 'docs/experiments/http-server/Server.rvn'
permissions:
  contents: read
  actions: read
jobs:
  http-project:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore matching SDK qualification inputs
        if: inputs.reuse_bundle_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_bundle_run }}
          name: windows-native-http-project-${{ inputs.reuse_bundle_run }}-1
          path: target/windows-http-project-validation/
      - name: Rebuild backend for focused SDK qualification
        if: inputs.reuse_bundle_run != ''
        run: cargo build --locked -p neoclr-aot-poc
      - name: Build and execute standalone Raven projects
        if: inputs.reuse_bundle_run == ''
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-native-http-project.py --output target/windows-http-project-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify managed HTTP collection pacing
        if: inputs.paced_gc && inputs.reuse_bundle_run == ''
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python benchmarks/http-gc-pacing/qualify-managed.py --bundle `"target/windows-http-project-validation/development toolchain/bundle`" --aot target/debug/neoclr-aot-poc.exe --output target/windows-http-project-validation/managed-pacing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify SDK-default runtime await
        if: inputs.runtime_await && inputs.reuse_bundle_run == ''
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-runtime-await-sdk.py --bundle `"target/windows-http-project-validation/development toolchain/bundle`" --runtime target/release/neoclr.exe --aot target/debug/neoclr-aot-poc.exe --output target/windows-http-project-validation/runtime-await-sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify SDK-default runtime await with retained inputs
        if: inputs.reuse_bundle_run != ''
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-runtime-await-sdk.py --bundle `"target/windows-http-project-validation/development toolchain/bundle`" --runtime target/windows-http-project-validation/runtime-await-sdk/installed/bundle/bin/neoclr.exe --aot target/debug/neoclr-aot-poc.exe --output target/windows-http-project-validation/runtime-await-sdk-rerun"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-http-project-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/windows-http-project-validation/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
