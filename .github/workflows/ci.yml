name: neoCLR
on:
  push:
    # Release candidates are validated before tagging; do not repeat for tag pushes.
    branches: ["**"]
    paths-ignore:
      - '**/*.md'
      - 'docs/*.json'
      - 'docs/experiments/ci-split/*.json'
      - 'docs/experiments/http-poc-package/*.json'
      - 'website/**'
      - 'api-docs/**'
      - '.config/dotnet-tools.json'
      - 'scripts/build-api-docs.py'
      - 'scripts/build-website.py'
      - 'scripts/test_build_website.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/*.json'
      - 'docs/experiments/ci-split/*.json'
      - 'docs/experiments/http-poc-package/*.json'
      - 'website/**'
      - 'api-docs/**'
      - '.config/dotnet-tools.json'
      - 'scripts/build-api-docs.py'
      - 'scripts/build-website.py'
      - 'scripts/test_build_website.py'
      - '.github/workflows/pages.yml'
  # Explicit exact-candidate validation remains available regardless of paths.
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Repeat the complete suite on all three operating systems
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_validate_host.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python scripts/validate-release.py --toolchain stable --release --output release-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-source-validation
          path: |
            release-validation/report.json
            release-validation/neoclr-source.tar

  host-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ !inputs.full_matrix }}
        run: python scripts/validate-host.py --toolchain stable --output host-validation
      - if: ${{ inputs.full_matrix }}
        run: python scripts/validate-release.py --toolchain stable --release --output release-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-validation-${{ matrix.os }}
          path: |
            host-validation/
            release-validation/report.json

  minimum-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      # Compile all cfg/platform branches, including tests, without rerunning them.
      - run: cargo check --locked --all-targets
