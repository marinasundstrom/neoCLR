name: neoCLR
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- run examples/features.neoil
      - run: cargo run --locked --example invoke
      - run: cargo run --locked --example build_native
      - run: cargo run --locked -- run examples/pinvoke.neoil

  minimum-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo run --locked -- run examples/features.neoil
      - run: cargo run --locked --example invoke
      - run: cargo run --locked --example build_native
      - run: cargo run --locked -- run examples/pinvoke.neoil
