name: Windows native project
on:
  workflow_dispatch:
    inputs:
      bundle_run:
        description: Successful matching native-toolchain candidate run
        required: true
        default: '41121692409'
  push:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'runtime/codegen/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'scripts/build-native-project.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-native-project.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'runtime/codegen/**'
      - 'tools/native/windows-*'
      - 'docs/experiments/aot-console/**'
      - 'docs/experiments/aot-fault-details/**'
      - 'samples/native-windows/**'
      - 'scripts/build-native-project.py'
      - 'scripts/validate-windows-project.py'
      - '.github/workflows/windows-native-project.yml'
permissions:
  contents: read
  actions: read
jobs:
  console-project:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      BUNDLE_RUN: ${{ inputs.bundle_run || '41121692409' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for selected package qualification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(85)
          do {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUNDLE_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($run.status -eq 'completed') { break }
            if ((Get-Date) -gt $deadline) { throw 'Timed out waiting for package qualification' }
            Start-Sleep -Seconds 30
          } while ($true)
          if ($run.conclusion -ne 'success') { throw "Package qualification failed: $($run.conclusion)" }
          if ($run.path -ne '.github/workflows/native-toolchain.yml') { throw 'Selected run is not native-toolchain qualification' }
          New-Item -ItemType Directory target/qualification -Force
          $run | ConvertTo-Json -Depth 20 | Set-Content target/qualification/package-run.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUNDLE_RUN }}
          name: windows-native-qualification
          path: target/qualification
      - name: Extract qualified package
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem target/qualification -Recurse -Filter neoclr-native-poc.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected exactly one qualified archive' }
          New-Item -ItemType Directory target/qualified
          tar -xzf $archives[0].FullName -C target/qualified
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and execute standalone Raven projects
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/validate-windows-project.py --bundle target/qualified/neoclr-native-poc --output target/windows-project-validation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-project-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/windows-project-validation/
            target/qualification/package-run.json
          retention-days: 14
          if-no-files-found: warn
