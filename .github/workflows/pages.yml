name: Project website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.py'
      - 'scripts/test_build_website.py'
      - 'examples/preview/result-void.neoil'
      - 'docs/experiments/raven-target/samples/*.rvn'
      - 'docs/experiments/raven-target/samples/*.expected.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/build-website.py'
      - 'scripts/test_build_website.py'
      - 'examples/preview/result-void.neoil'
      - 'docs/experiments/raven-target/samples/*.rvn'
      - 'docs/experiments/raven-target/samples/*.expected.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website tokenizer
        run: npm ci --prefix website --ignore-scripts
      - name: Check Raven highlighting
        run: npm test --prefix website
      - name: Check cross-page links
        run: python -m unittest discover -s scripts -p test_build_website.py
      - name: Build and check project site
        run: python scripts/build-website.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
