name: Native security provider
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/native-tls/**'
      - 'tools/native-crypto/**'
      - 'tools/security-provider/**'
      - 'tools/aot-poc/**'
      - 'docs/experiments/native-cryptography/**'
      - 'docs/experiments/shared-tls/**'
      - 'docs/experiments/aot-console/cryptography.c'
      - 'docs/experiments/aot-console/tls-managed*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'src/tls.rs'
      - 'src/gc.rs'
      - 'src/vm.rs'
      - 'tests/tls_services.rs'
      - 'runtime/neoCLR/Runtime/Tls.neoil'
      - 'src/cryptography.rs'
      - 'src/native.rs'
      - 'src/services.rs'
      - 'tests/cryptography.rs'
      - 'runtime/neoCLR/Runtime/Cryptography.neoil'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-native-security.py'
      - '.github/workflows/native-security-provider.yml'
  pull_request:
    paths:
      - 'tools/native-tls/**'
      - 'tools/native-crypto/**'
      - 'tools/security-provider/**'
      - 'tools/aot-poc/**'
      - 'docs/experiments/native-cryptography/**'
      - 'docs/experiments/shared-tls/**'
      - 'docs/experiments/aot-console/cryptography.c'
      - 'docs/experiments/aot-console/tls-managed*'
      - 'docs/experiments/aot-console/native-gc*'
      - 'src/tls.rs'
      - 'src/gc.rs'
      - 'src/vm.rs'
      - 'tests/tls_services.rs'
      - 'runtime/neoCLR/Runtime/Tls.neoil'
      - 'src/cryptography.rs'
      - 'src/native.rs'
      - 'src/services.rs'
      - 'tests/cryptography.rs'
      - 'runtime/neoCLR/Runtime/Cryptography.neoil'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-native-security.py'
      - '.github/workflows/native-security-provider.yml'
permissions:
  contents: read
jobs:
  provider:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' >> $env:GITHUB_PATH
      - name: Test shared client, server, primitives and managed lifetime
        if: runner.os != 'Windows'
        run: python scripts/test-native-security.py
      - name: Test shared security and managed lifetime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python scripts/test-native-security.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test typed interpreter services
        run: cargo test --locked --test cryptography --test runtime_services --test tls_services
      - name: Build native compiler and test binding admission
        run: |
          cargo build --locked --bin neoclr
          cargo build --locked --manifest-path tools/aot-poc/Cargo.toml
          cargo test --locked --manifest-path tools/aot-poc/Cargo.toml cryptography_tests --bin neoclr-aot-poc
          cargo test --locked --manifest-path tools/aot-poc/Cargo.toml tls_tests --bin neoclr-aot-poc
      - name: Qualify macOS execution modes
        if: runner.os == 'macOS'
        run: python docs/experiments/native-cryptography/validate.py --runtime target/debug/neoclr --compiler tools/aot-poc/target/debug/neoclr-aot-poc --output target/native-cryptography
      - name: Qualify Windows execution modes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python docs/experiments/native-cryptography/validate.py --runtime target/debug/neoclr.exe --compiler tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/native-cryptography"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify macOS TLS binding modes
        if: runner.os == 'macOS'
        run: python docs/experiments/shared-tls/validate-bindings.py --runtime target/debug/neoclr --compiler tools/aot-poc/target/debug/neoclr-aot-poc --output target/tls-bindings
      - name: Qualify Windows TLS binding modes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools not found' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python docs/experiments/shared-tls/validate-bindings.py --runtime target/debug/neoclr.exe --compiler tools/aot-poc/target/debug/neoclr-aot-poc.exe --output target/tls-bindings"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tls-bindings-${{ matrix.os }}-${{ github.run_id }}
          path: target/tls-bindings/validation.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cryptography-${{ matrix.os }}-${{ github.run_id }}
          path: target/native-cryptography/validation.json
          if-no-files-found: warn
