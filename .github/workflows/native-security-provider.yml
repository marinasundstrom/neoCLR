name: Native security provider
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/native-tls/**'
      - 'tools/security-provider/**'
      - 'src/cryptography.rs'
      - 'src/native.rs'
      - 'src/services.rs'
      - 'tests/cryptography.rs'
      - 'runtime/neoCLR/Runtime/Cryptography.neoil'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-native-security.py'
      - '.github/workflows/native-security-provider.yml'
  pull_request:
    paths:
      - 'tools/native-tls/**'
      - 'tools/security-provider/**'
      - 'src/cryptography.rs'
      - 'src/native.rs'
      - 'src/services.rs'
      - 'tests/cryptography.rs'
      - 'runtime/neoCLR/Runtime/Cryptography.neoil'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-native-security.py'
      - '.github/workflows/native-security-provider.yml'
permissions:
  contents: read
jobs:
  provider:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\usr\bin' >> $env:GITHUB_PATH
      - name: Test shared client, server and primitives
        run: python scripts/test-native-security.py
      - name: Test typed interpreter services
        run: cargo test --locked --test cryptography --test runtime_services
